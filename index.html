    if(d.itab){ ui.itab = d.itab; window.scrollTo(0,0); route(); return; }
    if(d.isof!==undefined){ ui.isof = d.isof; rerender(); return; }
    if(d.isoopen){ ui.isoopen = ui.isoopen===d.isoopen ? null : d.isoopen; rerender(); return; }
    if(d.isogo){ const [h,tb] = d.isogo.split('|'); if(tb){ if(h==='iso'){ if(tb.startsWith('i7:')){ ui.itab='onderst'; ui.i7 = tb.slice(3); } else if(tb.startsWith('i8:')){ ui.itab='uitv'; ui.i8 = tb.slice(3); } else if(tb.startsWith('i9:')){ ui.itab='evalu'; ui.i9 = tb.slice(3); } else if(tb.startsWith('i10:')){ ui.itab='verb'; ui.i10 = tb.slice(4); } else ui.itab = tb; } if(h==='bestuurlijk') ui.btab = tb; if(h==='strategisch') ui.stab = tb; if(h==='tactisch') ui.ttab = tb; if(h==='conditie') ui.ctab = tb; if(h==='operationeel') ui.otab = tb; } location.hash = h; route(); window.scrollTo(0,0); return; }
    if(d.e1){ ui.e1 = d.e1; rerender(); return; }
    if(d.e1go!==undefined){ const [h,tb] = d.e1go.split('|'); if(h==='conditie'&&tb) ui.ctab = tb; if(h==='tactisch'&&tb) ui.ttab = tb; location.hash = h; route(); window.scrollTo(0,0); return; }
    if(d.mjover){ const n = mjopOvernemen(); r.textContent = `✓ ${n} nieuwe activiteit(en) overgenomen`; return; }
    if(d.cyadd){ const b = state.data.assets.find(a=>a.id===d.cyadd); (b.cycli ||= []).push({id:uid(), oms:'', interval:'', kosten:'', start:''}); save(); rerender(); return; }
    if(d.cydel){ const [bid,cid] = d.cydel.split('|'); const b = state.data.assets.find(a=>a.id===bid); b.cycli = b.cycli.filter(c=>c.id!==cid); save(); rerender(); return; }
    if(d.mkm){ maakVanGebrek('m', d.mkm); return; }
    if(d.mkr){ maakVanGebrek('r', d.mkr); return; }
    if(d.gvset){ GV().aspecten = (d.gvset==='rams'?ASP_RAMS:ASP_STD).map(([naam,letter,wa,oms])=>({id:uid(), naam, letter, wa, oms})); GV().matrix = {}; save(); rerender(); return; }
    if(d.gvadd){ GV().aspecten.push({id:uid(), naam:'Nieuw aspect', letter:'', wa:'', oms:''}); save(); rerender(); return; }
    if(d.gvdel){ GV().aspecten = GV().aspecten.filter(a=>a.id!==d.gvdel); save(); rerender(); return; }
    if(d.vadd){ opnames()[ui.oinsp][ui.obd].extra.verz.gebreken.push({id:uid(), oms:'', ernst:'', int:'', omv:''}); save(); rerender(); return; }
    if(d.vdel){ const V = opnames()[ui.oinsp][ui.obd].extra.verz; V.gebreken = V.gebreken.filter(g=>g.id!==d.vdel); save(); rerender(); return; }
    if(d.obdgo){ ui.obd = d.obdgo; ui.ctab = 'gebreken'; window.scrollTo(0,0); route(); return; }
    if(d.bibimp){ const f = document.getElementById('bibfile'); f.onchange = async ()=>{ try{ importBib(await f.files[0].text(), f.files[0].name); rerender(); }catch(err){ console.log('Ongeldig bibliotheekbestand', err); } }; f.click(); return; }
    if(d.dbimp){ const f = document.getElementById('dbfile'); f.onchange = async ()=>{ try{ importDbib(await f.files[0].text()); }catch(err){ ui.dbwarn = 'Ongeldig bestand: dit is geen decompositiebibliotheek (JSON).'; } rerender(); }; f.click(); return; }
    if(d.dbexp){ exportDbib(); return; }
    if(d.dbdel){ if(ui.dbarmed){ delete state.data.dbib; dbIdx = null; ui.dbarmed = false; ui.dbsel = {}; save(); } else { ui.dbarmed = true; r.textContent = 'Klik nogmaals om te verwijderen'; return; } rerender(); return; }
    if(d.dbview){ ui.dbview = d.dbview; rerender(); return; }
    if(d.dbbo!==undefined){ ui.dbsel = {bo:+d.dbbo}; ui.dbgb = null; rerender(); return; }
    if(d.dbel!==undefined){ ui.dbsel = {...ui.dbsel, el:+d.dbel, bd:null}; ui.dbgb = null; rerender(); return; }
    if(d.dbbd!==undefined){ ui.dbsel = {...ui.dbsel, bd:+d.dbbd}; ui.dbgb = null; ui.dbmat = null; rerender(); return; }
    if(d.dbgb!==undefined){ ui.dbgb = +d.dbgb; rerender(); return; }
    if(d.dbmat!==undefined){ const D = dbib(), bd = ui.dbsel.bd; const cur = new Set((ui.dbmat && ui.dbmatBd===bd) ? ui.dbmat : D.bd[bd].m); const m = +d.dbmat; cur.has(m) ? cur.delete(m) : cur.add(m); ui.dbmat = [...cur]; ui.dbmatBd = bd; rerender(); return; }
    if(d.dbhit){ const [l,i] = d.dbhit.split(':'); const D = dbib(), I = dbIndex(); const n = +i;
      if(l==='bo') ui.dbsel = {bo:n};
      else if(l==='el') ui.dbsel = {bo:I.elBo[n][0] ?? 0, el:n};
      else { const e = I.bdEl[n][0]; ui.dbsel = {bo:e!=null ? (I.elBo[e][0] ?? 0) : 0, el:e ?? null, bd:e!=null ? n : null}; }
      ui.dbgb = null; ui.dbq = ''; rerender(); return; }
    if(d.dbegf!==undefined){ ui.dbegf = d.dbegf; rerender(); return; }
    if(d.bibcsv){ exportBibCSV(); return; }
    if(d.bibdel){ if(ui.bibarmed){ delete state.data.bib; bibIndex = null; ui.bibarmed = false; save(); } else { ui.bibarmed = true; r.textContent = 'Klik nogmaals om te verwijderen'; return; } rerender(); return; }
    if(d.bsec){ ui.bsec = d.bsec; rerender(); return; }
    if(d.bdisc!==undefined){ ui.bdisc = d.bdisc; ui.bsec = null; rerender(); return; }
    if(d.obd){ ui.obd = d.obd; rerender(); return; }
    if(d.gadd){ const op = opnames()[ui.oinsp][ui.obd]; op.gebreken.push({id:uid(), oms:'', ernst:'', int:'', omv:'', comp:'', stapel:''}); save(); rerender(); return; }
    if(d.gdel){ const op = opnames()[ui.oinsp][ui.obd]; op.gebreken = op.gebreken.filter(g=>g.id!==d.gdel); op.gebreken.forEach(g=>{ if(g.stapel===d.gdel) g.stapel=''; }); save(); rerender(); return; }
    if(d.sbadd){ (state.data.sandbox ||= {vw:'',rows:[]}).rows.push({id:uid(), comp:'', compVw:'', oms:'', ernst:'', int:'', omv:'', stapel:''}); save(); rerender(); return; }
    if(d.sbdel){ const S = state.data.sandbox; S.rows = S.rows.filter(x=>x.id!==d.sbdel); S.rows.forEach(x=>{ if(x.stapel===d.sbdel) x.stapel=''; }); save(); rerender(); return; }
    if(d.sbclear){ state.data.sandbox = {vw:'', rows:[]}; save(); rerender(); return; }
    if(d.t27exp){ const blob = new Blob([JSON.stringify({type:'nen2767-rekentabellen', versie:1, tabellen:T27()},null,2)],{type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'nen2767-rekentabellen.json'; a.click(); return; }
    if(d.t27imp){ const f = document.getElementById('t27file'); f.onchange = async ()=>{ try{ const j = JSON.parse(await f.files[0].text()); if(j.type!=='nen2767-rekentabellen') throw 0; state.data.n2767 = {...T27(), ...j.tabellen}; save(); rerender(); }catch(err){ console.log('Ongeldig tabellenbestand'); } }; f.click(); return; }
    if(d.ctab){ ui.ctab = d.ctab; window.scrollTo(0,0); route(); return; }
    if(d.otab){ ui.otab = d.otab; window.scrollTo(0,0); route(); return; }
    if(d.cvoorstel){ const it = items('concepten').find(x=>x.id===d.cvoorstel); it.onderhoud = d.cv; it._t = Date.now(); save(); rerender(); return; }
    if(d.ttab){ ui.ttab = d.ttab; if(location.hash!=='#tactisch'){ location.hash='tactisch'; } window.scrollTo(0,0); route(); return; }
    if(d.kopen){ ui.kcluster = d.kopen; ui.kfase=null; ui.ttab='kompas'; window.scrollTo(0,0); route(); return; }
    if(d.kfase){ ui.kfase = d.kfase; rerender(); return; }
    if(d.kmaak){ const c = items('clusters').find(x=>x.id===ui.kcluster); c.kompas ||= {}; c.kompas[d.kmaak] = JSON.parse(JSON.stringify(c.kompas.gebruik||{})); c.kchanged=Date.now(); save(); rerender(); return; }
    if(d.kw){ const c = items('clusters').find(x=>x.id===ui.kcluster); const f = ui.kfase||'gebruik'; c.kompas ||= {}; const k = (c.kompas[f] ||= {});
      const prev = k[d.kw]||{}; k[d.kw] = {...prev, w:+d.kv}; if(prev.t===undefined && f!=='gebruik'){ k[d.kw].t = (c.kompas.gebruik||{})[d.kw]?.t||''; } c.kchanged=Date.now(); save(); rerender(); return; }
    if(d.kvast){ const c = items('clusters').find(x=>x.id===ui.kcluster); const f = ui.kfase||'gebruik';
      if(!c.kompas?.[f]) { c.kompas ||= {}; c.kompas[f] = {}; }
      const m = {ts:Date.now(), datum:new Date().toISOString().slice(0,10), reden:document.getElementById('kreden').value, ao:document.getElementById('kao').checked};
      (c.kmeta ||= {})[f] = m; ((c.khist ||= {})[f] ||= []).push(m); save(); rerender(); return; }
    if(d.eisvoorstel){ const it = items('eisen').find(x=>x.id===d.eisvoorstel); const c = items('clusters').find(x=>x.id===it.cluster);
      const n = niveauData().find(x=>x.naam===it.maatstaf); it.niveau = n.v[bijdrage(c,it.aspect,faseKey(it.fase))]; it._t=Date.now(); save(); rerender(); return; }
    if(d.nvadd){ niveauData().push({id:uid(), naam:'Nieuwe maatstaf', v:['n.v.t.','','','']}); save(); rerender(); return; }
    if(d.nvdel){ state.data.niveau = niveauData().filter(n=>n.id!==d.nvdel); save(); rerender(); return; }
    if(d.voorbeeld){ laadVoorbeeld(d.voorbeeld); ui.ttab='overzicht'; rerender(); return; }
    if(d.loada){ laadBijlageA(); ui.wview='tabel'; rerender(); return; }
    if(d.wview){ ui.wview = d.wview; rerender(); return; }
    if(d.newdoel||d.gotodoel){
      let id = d.gotodoel;
      if(d.newdoel){ const it = {id:uid(), aspect:d.newdoel, status:'Concept'}; items('amdoelen').push(it); id = it.id; save(); }
      ui.sel.amdoelen = id; ui.stab = 'amdoelen'; location.hash = 'strategisch'; route(); window.scrollTo(0,0);
      main.querySelector('[data-rf="titel"]')?.focus(); return;
    }
    if(d.signal){
      items('consequenties').push({id:uid(), sig:'beleid', titel:'Geen (volledig) assetmanagementbeleid meegegeven', soort:'Gebrek aan sturing (geen besluit genomen)',
        omschrijving:'Zonder beleid kan het in stand houden niet bewust sturen op alle relevante waardeaspecten; het beheer blijft beperkt tot functionele instandhouding en compliance. Verzoek aan de asset owner om sturing te geven.'});
      save(); rerender(); return;
    }
    if(d.btab){ ui.btab = d.btab; window.scrollTo(0,0); route(); return; }
    if(d.stab){ ui.stab = d.stab; window.scrollTo(0,0); route(); return; }
    if(d.print){ window.print(); return; }
    if(d.rsel){ const [k,id] = d.rsel.split(':'); ui.sel[k]=id; ui.rarmed=null; }
    else if(d.radd){ if(d.radd==='waardeaspecten') ui.wview='lijst'; const it = {id:uid(), _t:Date.now()}; items(d.radd).push(it); ui.sel[d.radd]=it.id; ui.rarmed=null; save(); rerender();
      main.querySelector('.form input, .form select')?.focus(); return; }
    else if(d.rdel){ const [k,id] = d.rdel.split(':');
      if(ui.rarmed!==id){ ui.rarmed=id; } else { state.data.reg[k] = items(k).filter(x=>x.id!==id); ui.sel[k]=null; ui.rarmed=null; save(); } }
    else if(d.apply){ const b = items('besluiten').find(x=>x.id===d.apply); const f = b.richting==='Opwaarderen'?'op':'af';
      for(const a of state.data.assets) if(b.assets.includes(a.id)){ a.fase=f; a._ft=Date.now(); a.toelichting = (b.titel||'Besluit')+(b.datum?' ('+b.datum+')':''); }
      save(); }
    rerender(); return;
  }
  const t = e.target.closest('[data-step],[data-tab],[data-phase],[data-schil],[data-tier],[data-glb],[data-node],[data-add],[data-del],[data-krit]');
  if(!t) return;
  const d = t.dataset;
  if(d.step){ ui.step = d.step; }
  else if(d.tab){ ui.tab = d.tab; }
  else if(d.phase){ ui.phase = d.phase; }
  else if(d.schil){ ui.schil = d.schil; }
  else if(d.tier){ ui.tier = d.tier; }
  else if(d.glb!==undefined){ ui.glb = d.glb; }
  else if(d.node){ ui.node = d.node; ui.armed=false; }
  else if(d.add!==undefined){
    const parent = d.add || null;
    const p = state.data.assets.find(x=>x.id===parent);
    const a = {id:uid(), parent, niveau:p?p.niveau+1:0, naam:'', assettype:'', fase:p?p.fase:'gebruik', krit:null};
    state.data.assets.push(a); ui.node = a.id; ui.armed=false; save();
    rerender(); main.querySelector('[data-f="naam"]')?.focus(); return;
  }
  else if(d.del){
    if(!ui.armed){ ui.armed = true; }
    else{
      const kill = new Set([d.del]); let grew = true;
      while(grew){ grew=false; for(const a of state.data.assets) if(!kill.has(a.id)&&kill.has(a.parent)){kill.add(a.id);grew=true;} }
      state.data.assets = state.data.assets.filter(a=>!kill.has(a.id)); ui.node=null; ui.armed=false; save();
    }
  }
  else if(d.krit){ const a = state.data.assets.find(x=>x.id===ui.node); a.krit = a.krit===+d.krit?null:+d.krit; save(); }
  rerender();
});
main.addEventListener('input', e=>{
  const el = e.target, d = el.dataset;

    if(el.tagName==='SELECT') rerender(); else { el.style.borderColor = isNum(el.value)?'':'#e0a95c'; } return; }
  if(d.oinsp){ ui.oinsp = el.value; ui.obd = null; rerender(); return; }

  if(d.cm){ (ISO().compmat ||= {})[d.cm] = el.value; save(); rerender(); return; }
  if(d.iscope){ ISO().scope[d.iscope] = el.value; save(); return; }
  if(d.iraci){ ISO().raci[d.iraci] = el.value; save(); if(el.tagName==='SELECT') rerender(); return; }
  if(d.gh){ const g = opnames()[ui.oinsp][ui.obd].gebreken.find(x=>x.id===d.gid); const h = (g.herstel ||= {}); h[d.gh] = el.type==='checkbox' ? el.checked : el.value; save(); if(el.type==='checkbox') rerender(); return; }

  if(d.mj7){ const b = state.data.assets.find(a=>a.id===d.mj7); b.mjStap7 = el.checked?'':'nee'; save(); rerender(); return; }

  if(d.geff){ const g = opnames()[ui.oinsp][ui.obd].gebreken.find(x=>x.id===d.gid); (g.eff ||= {})[d.geff] = el.value; save(); rerender(); return; }
  if(d.pcl){ ui.pcl = el.value; rerender(); return; }
  if(d.gva){ const a = GV().aspecten.find(x=>x.id===d.gaid); a[d.gva] = el.value; save(); if(el.tagName==='SELECT') rerender(); return; }
  if(d.gvm){ const M = GV().matrix; (M[d.gvm] ||= ['','',''])[+d.gvi] = el.value; save(); return; }
  if(d.gvmeth){ GV().methode = el.value; save(); rerender(); return; }
  if(d.ex){ opnames()[ui.oinsp][ui.obd].extra[d.ex] = el.value; save(); if(el.tagName==='SELECT') rerender(); return; }
  if(d.exs){ const E = opnames()[ui.oinsp][ui.obd].extra; (E.spec ||= {})[d.exs] = el.value; save(); if(el.tagName==='SELECT') rerender(); return; }
  if(d.exv){ opnames()[ui.oinsp][ui.obd].extra.verz[d.exv] = el.value; save(); rerender(); return; }
  if(d.vg){ const g = opnames()[ui.oinsp][ui.obd].extra.verz.gebreken.find(x=>x.id===d.vid); g[d.vg] = el.value; save(); if(el.tagName==='SELECT') rerender(); return; }
  if(el.id==='dbq' || el.id==='dbgq'){ const k = el.id; ui[k] = el.value; const pos = el.selectionStart; rerender(); const i2 = document.getElementById(k); i2.focus(); i2.setSelectionRange(pos,pos); return; }
  if(d.dbeg!==undefined){ const e = dbib().el.find(x=>x.c===d.dbeg); if(el.value===(e.g||'')) delete dbEg()[d.dbeg]; else dbEg()[d.dbeg] = el.value; save(); rerender(); return; }
  if(el.id==='bq'){ ui.bq = el.value; const pos = el.selectionStart; rerender(); const i2 = document.getElementById('bq'); i2.focus(); i2.setSelectionRange(pos,pos); return; }
  if(d.gpick){ const g = opnames()[ui.oinsp][ui.obd].gebreken.find(x=>x.id===d.gpick); const bd = state.data.assets.find(a=>a.id===ui.obd); const sec = bibSectie(bd.code);
    const x = el.value===''?null:sec.gebreken[+el.value];
    if(x){ Object.assign(g, {code:x.code, oms:x.naam, ernst:x.ernst, soort:x.soort}); if(x.int) g.int = String(x.int); } else { g.code = ''; }
    save(); rerender(); return; }
  if(d.gr==='soort'){ const g = opnames()[ui.oinsp][ui.obd].gebreken.find(x=>x.id===d.gid); g.soort = el.value; const r = RAAMWERK.find(x=>x[1]===el.value); if(r) g.ernst = r[0]; save(); rerender(); return; }
  if(d.gr){ const g = opnames()[ui.oinsp][ui.obd].gebreken.find(x=>x.id===d.gid); g[d.gr] = el.value; save(); if(d.gr==='comp'||d.gr==='oms') { if(d.gr==='comp') { rerender(); return; } } refreshCalc(); return; }
  if(d.sbvw){ state.data.sandbox.vw = el.value; save(); refreshCalc(); return; }
  if(d.sb){ const r = state.data.sandbox.rows.find(x=>x.id===d.sid); r[d.sb] = el.value; save(); refreshCalc(); return; }
  if(d.kr){ const k = (ui.kr ||= {L:40,t:20,C:3,bd:''});
    if(d.kr==='bd'){ k.bd = el.value; const b = state.data.assets.find(a=>a.id===el.value); if(b){ k.L = num(b.levensduur); k.t = Math.max(0, new Date().getFullYear()-num(b.bouwjaar)); } rerender(); return; }
    k[d.kr] = el.value; if(d.kr==='L'){ k.t = Math.min(+k.t, num(k.L)||40); const rg = main.querySelector('[data-kr="t"]'); if(rg){ rg.max = num(k.L)||40; rg.value = k.t; } }
    const tl = document.getElementById('krtl'); if(tl) tl.textContent = k.t;
    document.getElementById('krwrap').innerHTML = krommeInner(); return; }
  if(d.ampc){ ui.ampc = el.value; rerender(); return; }
  if(d.mw){ const m = items('maatregelen').find(x=>x.id===d.mw); m[d.mk] = el.value; m._t=Date.now(); if(d.mk==='status'&&el.value==='Gereed'&&!m.gereed){ m.gereed = new Date().toISOString().slice(0,10); } save(); if(el.tagName==='SELECT') rerender(); return; }
  if(d.op){ (state.data.op ||= {})[d.op] = el.value; save(); if(el.tagName==='SELECT') rerender(); return; }
  if(d.kcluster){ ui.kcluster = el.value; ui.kfase=null; rerender(); return; }
  if(d.kcompare){ ui.kcompare = el.checked; rerender(); return; }
  if(d.kt){ const c = items('clusters').find(x=>x.id===ui.kcluster); const f = ui.kfase||'gebruik'; c.kompas ||= {}; const k = (c.kompas[f] ||= {});
    k[d.kt] = {...(k[d.kt]||{w:bijdrage(c,d.kt,f)}), t:el.value}; c.kchanged=Date.now(); save(); return; }
  if(d.reff){ const it = items('risicos').find(x=>x.id===d.rid2); (it.effect ||= {})[d.reff] = el.value; it._t=Date.now(); save(); rerender(); return; }
  if(d.nv){ const n = niveauData().find(x=>x.id===d.nv); if(d.ni==='naam') n.naam = el.value; else n.v[+d.ni] = el.value; save(); return; }
  if(d.rg){ rgrens()[d.rg] = +el.value || 1; save(); return; }
  if(d.rf){
    const it = items(d.rk).find(x=>x.id===d.rid); if(!it) return;
    if(el.type==='checkbox'){ const arr = new Set(it[d.rf]||[]); el.checked?arr.add(d.rv):arr.delete(d.rv); it[d.rf]=[...arr]; }
    else it[d.rf] = el.value;
    it._t = Date.now();
    save();
    if(el.tagName==='SELECT' || el.type==='checkbox' || el.type==='date') rerender();
    else { const l = main.querySelector(`[data-rsel="${d.rk}:${d.rid}"] .rl`); if(l) l.innerHTML = esc(REG[d.rk].label(it))||'<i class="muted">(naamloos)</i>'; }
    return;
  }
  if(d.af){
    const a = state.data.assets.find(x=>x.id===d.af); if(!a) return;
    if(el.type==='checkbox'){ const s = new Set(a[d.ak]||[]); el.checked?s.add(d.rv):s.delete(d.rv); a[d.ak]=[...s]; }
    else a[d.ak] = el.value;
    if(d.ak==='fase') a._ft = Date.now();
    if(d.ak==='code'){ const e = bibElement(el.value); if(e){ if(!a.materiaal && e.materiaal) a.materiaal = e.materiaal; save(); rerender(); return; } }
    save(); if(d.ak==='fase'||d.ak==='transEind') rerender(); return;
  }
  if(d.best){ state.data.best[d.best] = el.value; save(); if(el.tagName==='SELECT') rerender(); return; }
  if(d.info){ (state.data.info[d.info] ||= {})[d.ik] = el.value; save(); return; }
  if(e.target.id==='glq'){
    ui.glq = e.target.value; const pos = e.target.selectionStart; rerender();
    const i = document.getElementById('glq'); i.focus(); i.setSelectionRange(pos,pos); return;
  }
  const f = e.target.dataset.f; if(!f) return;
  const a = state.data.assets.find(x=>x.id===ui.node); if(!a) return;
  a[f] = e.target.value; if(f==='fase') a._ft = Date.now(); save();
  if(f==='fase') rerender();
  else { const n = main.querySelector(`[data-node="${a.id}"] span:nth-child(2)`); if(n && f==='naam') n.innerHTML = esc(a.naam)||'<i class="muted">(naamloos)</i>'; }
});

/* ---------------- Header: rol, sector, export/import ---------------- */
const rolSel = document.getElementById('rol');
rolSel.innerHTML = Object.entries(ROLLEN).map(([k,r])=>`<option value="${k}">${r.naam}</option>`).join('');
rolSel.value = state.rol;
rolSel.onchange = ()=>{ state.rol = rolSel.value; save(); rerender(); };
const sel = document.getElementById('sector');
sel.innerHTML = SECTOREN.map(s=>`<option value="${s.id}">${s.naam}</option>`).join('');
sel.value = state.sector;
sel.onchange = ()=>{ state.sector = sel.value; save(); rerender(); };

document.getElementById('btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `nen8026-gegevens-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
};
const fileInput = document.getElementById('fileImport');
document.getElementById('btnImport').onclick = ()=>fileInput.click();
fileInput.onchange = async ()=>{
  const f = fileInput.files[0]; if(!f) return;
  try{ const s = JSON.parse(await f.text()); state = {...DEFAULT, ...s, data:{...DEFAULT.data, ...(s.data||{})}}; save();
       sel.value = state.sector; rolSel.value = state.rol; route(); }
  catch(e){ console.log('Ongeldig bestand'); }
  fileInput.value='';
};

window.addEventListener('hashchange', ()=>{ window.scrollTo(0,0); route(); });
route();
</script>
</body>
</html>
