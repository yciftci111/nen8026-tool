<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waardegestuurd in stand houden – NEN 8026 tool</title>
<style>
  :root{
    --bg:#f5f6f4; --panel:#ffffff; --ink:#1d2321; --muted:#5f6b66; --line:#dde2df;
    --accent:#1f6f5c; --accent-soft:#e3f0ec; --scope:#6aa84f;
    --l1:#7a4b8c; --l2:#2d5f9a; --l3:#1f6f5c; --l4:#b5651d;
    --l1s:#f3ecf6; --l2s:#e8eff8; --l3s:#e3f0ec; --l4s:#f9eee3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:13px}
  header .spacer{flex:1}
  .ctl{display:flex;flex-direction:column;gap:2px}
  .ctl label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  select,button,input,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  button{cursor:pointer}
  button:hover{border-color:#b9c3be}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.danger{color:#a3322a}
  button.danger.armed{background:#a3322a;color:#fff;border-color:#a3322a}
  .layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}
  nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 0}
  nav .group{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 20px 6px}
  nav a{display:flex;align-items:center;gap:10px;padding:7px 20px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent}
  nav a:hover{background:var(--bg)}
  nav a.active{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
  nav a.dim{opacity:.38}
  nav .dot{width:9px;height:9px;border-radius:50%;flex:none}
  main{padding:26px 34px;max-width:1150px}
  main h2{margin:0 0 4px;font-size:24px}
  h3{font-size:16px;margin:0 0 6px}
  .ref{color:var(--muted);font-size:13px;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card p{margin:0;color:var(--muted);font-size:13px}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#eee;color:var(--muted)}
  .badge.todo{background:#fff3e0;color:#9a5b00}
  .badge.ok{background:var(--accent-soft);color:var(--accent)}
  .note{background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:14px}
  .warn{background:#fff6e5;border:1px solid #f0d9a8;border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 18px;flex-wrap:wrap}
  .tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted)}
  .tabs button.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .info{margin-top:14px;min-height:60px}
  .info .panel{border-left:4px solid var(--accent)}
  .muted{color:var(--muted)}
  .small{font-size:13px}

  /* ---------- Methodekaart (eigen weergave van de stappen) ---------- */
  .map{display:grid;grid-template-columns:38px 1fr 38px;gap:8px}
  .side{border-radius:8px;background:#eef1ef;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);
        display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;cursor:pointer}
  .side.right{transform:none}
  .side:hover{background:#e2e8e5;color:var(--ink)}
  .bands{display:flex;flex-direction:column;gap:6px;position:relative}
  .band{border-radius:10px;padding:10px 12px 12px;position:relative}
  .band .bh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:8px}
  .band .bh span:last-child{font-weight:500;color:var(--muted)}
  .b1{background:var(--l1s)} .b2{background:var(--l2s)} .b3{background:var(--l3s)} .b4{background:var(--l4s)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .col{display:flex;flex-direction:column;gap:6px}
  .colh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:600}
  .step{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;text-align:left;width:100%;display:flex;justify-content:space-between;gap:6px;align-items:center}
  .step:hover{border-color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .step.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .step.out{border-style:dashed;color:var(--muted)}
  .step.dim{opacity:.35}
  .step .r{font-size:11px;color:var(--muted);white-space:nowrap}
  .step.phase{background:var(--l2);color:#fff;border-color:var(--l2);font-weight:600;justify-content:center}
  .step.phase .r{color:#dfe8f3}
  .scopebox{border:2px solid var(--scope);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;position:relative}
  .scopetag{position:absolute;top:-11px;right:14px;background:var(--scope);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:18px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

  /* ---------- Levensfasen ---------- */
  .phases{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ph{flex:1;min-width:120px;padding:14px 8px;text-align:center;border-radius:8px;border:2px solid var(--l2);font-weight:600;font-size:13px;cursor:pointer;background:#fff;color:var(--l2)}
  .ph.in{background:var(--l2);color:#fff}
  .ph.sel{outline:3px solid var(--scope);outline-offset:2px}
  .arrow{color:var(--muted)}

  /* ---------- Rollenpiramide ---------- */
  .pyr{display:grid;grid-template-columns:130px 1fr 1fr 150px;gap:8px;align-items:stretch}
  .pyr .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .tier{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;min-height:56px;cursor:pointer;text-align:center;padding:4px 6px}
  .lvl{border-radius:8px;display:flex;align-items:center;padding:8px 10px;font-size:13px;font-weight:600}
  .tasks{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  .prod{border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;text-align:center}
  .pyr .rowsel .tasks{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

  /* ---------- Begrippen ---------- */
  .gl-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .gl-tools input{flex:1;min-width:220px}
  .gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .term{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .term b{font-size:14px}
  .term .tag{float:right;font-size:11px;color:var(--muted)}
  .term p{margin:6px 0 0;font-size:13px}
  .chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ---------- Assetstructuur ---------- */
  .tree-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
  .tree{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:300px}
  .node{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:14px}
  .node:hover{background:var(--bg)}
  .node.sel{background:var(--accent-soft)}
  .node .lv{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
  .fase{font-size:11px;padding:1px 7px;border-radius:99px;margin-left:auto;white-space:nowrap}
  .f-gebruik{background:#e8eff8;color:#2d5f9a}
  .f-op{background:#e7f4e1;color:#3d7a26}
  .f-af{background:#fdeee0;color:#9a5b00}
  .f-weg{background:#eee;color:#777}
  .form{display:grid;gap:10px}
  .form label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
  .form input,.form select,.form textarea{width:100%}
  .krit{display:flex;gap:4px}
  .krit button{flex:1;padding:6px 0}
  .krit button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pick{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fafbfa}
  .pick label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);margin:0;cursor:pointer}
  .pick input{width:auto;margin:0}
  #samp h3,.printdoc h3{margin-top:16px} #samp ul,.printdoc ul{margin:4px 0;padding-left:20px;font-size:14px}
  @media print{
    header,nav,.tabs,footer,.noprint,main>h2,main>.ref{display:none!important}
    .layout{display:block} main{padding:0;max-width:none} body{background:#fff}
    #samp,.printdoc{border:none;padding:0}
  }
  main{min-width:0;overflow-x:hidden}
  .cb{display:inline-flex;white-space:nowrap;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 6px;border-radius:5px;color:#fff;font-weight:700;font-size:12px;text-decoration:none}
  footer{color:var(--muted);font-size:12px;padding:30px 0 10px}

  @media (max-width:860px){
    .layout{grid-template-columns:1fr} nav{border-right:none;border-bottom:1px solid var(--line)}
    main{padding:18px} .tree-wrap{grid-template-columns:1fr} .pyr{grid-template-columns:90px 1fr} .pyr .tasks,.pyr .prod,.pyr .h:nth-child(n+3){display:none}
    .row{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Waardegestuurd in stand houden</h1>
    <div class="sub">Tool op basis van de methode uit NEN 8026 · v0.22</div>
  </div>
  <div class="spacer"></div>
  <div class="ctl"><label for="rol">Ik werk als</label><select id="rol"></select></div>
  <div class="ctl"><label for="sector">Sector</label><select id="sector"></select></div>
  <div class="ctl"><label>&nbsp;</label><div style="display:flex;gap:6px">
    <button id="btnExport">Exporteren</button><button id="btnImport">Importeren</button></div></div>
  <input type="file" id="fileImport" accept=".json" hidden>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
/* ==================================================================
   NB: Deze tool bevat GEEN tekst of figuren uit NEN 8026.
   Omschrijvingen zijn eigen samenvattingen; figuren zijn eigen
   weergaven. Raadpleeg altijd de norm zelf (verwijzingen per §).
   ================================================================== */

/* ---------------- Rollen ---------------- */
const ROLLEN = {
  alle:{naam:'Alle rollen'},
  AO:{naam:'Asset owner (AO)', niveaus:['bestuurlijk']},
  GAO:{naam:'Gemandateerd asset owner', niveaus:['strategisch']},
  AM:{naam:'Assetmanager (AM)', niveaus:['strategisch','tactisch']},
  SP:{naam:'Serviceprovider (SP)', niveaus:['operationeel']},
};

/* ---------------- Modules (menu) ---------------- */
const MODULES = [
  { id:'start', group:'Basis', title:'Methodekaart', color:'var(--accent)' },
  { id:'basis', group:'Basis', title:'Begrippen & methode', ref:'H3 en H4', color:'var(--accent)' },
  { id:'bestuurlijk', group:'Niveaus', title:'Bestuurlijk niveau', ref:'H5', color:'var(--l1)', product:'Kaders',
    parts:[['Belangen stakeholders','§5.3.1'],['Organisatiedoelstellingen','§5.3.2'],['Randvoorwaarden','§5.3.3'],
      ['Perspectief en besluit','§5.3.4'],['Dilemma\'s','§5.3.5'],['Tijdige communicatie','§5.3.6'],['Assessment','§5.4'],['Informatiebehoefte','§5.5']]},
  { id:'strategisch', group:'Niveaus', title:'Strategisch niveau', ref:'H6', color:'var(--l2)', product:'SAMP',
    parts:[['Waardeaspecten bijeenbrengen','§4.8 fig. 5 / H6'],['Assetmanagementdoelstellingen','§6.3.1'],['Levensfasen vaststellen','§6.3.2'],
      ['Consequenties inzichtelijk','§6.3.3'],['Dilemma\'s','§6.3.4'],['Vastlegging','§6.3.5'],['Assessment','§6.4'],['Informatiebehoefte','§6.5']]},
  { id:'tactisch', group:'Niveaus', title:'Tactisch niveau', ref:'H7', color:'var(--l3)', product:'AMP',
    parts:[['Waardekompassen opstellen','§7.3.1'],['Waardekompassen bijstellen','§7.3.2'],['Instandhoudingseisen','§7.3.3'],['Risicoanalyse','§7.3.4'],
      ['Instandhoudingsconcepten opstellen','§7.3.5'],['Instandhoudingsconcepten bijstellen','§7.3.6'],['Uitvoeringseisen','§7.3.7'],
      ['Plannen en begrotingen','§7.3.8'],['Advies aan asset owner','§7.3.9'],['Dilemma\'s','§7.3.10'],['Vastlegging','§7.3.11'],['Assessment','§7.4'],['Informatiebehoefte','§7.5']]},
  { id:'operationeel', group:'Niveaus', title:'Operationeel niveau', ref:'H8', color:'var(--l4)', product:'Uitvoeringsplannen',
    parts:[['Werkzaamheden instandhouding','§8.2.1'],['Observaties','§8.2.2'],['Assetportfolio inventariseren','§8.2.3'],
      ['Vastlegging','§8.2.4'],['Assessment','§8.3'],['Informatiebehoefte','§8.4']]},
  { id:'assets', group:'Inrichting', title:'Assetstructuur', ref:'§3.10–3.14, §4.4', color:'var(--muted)' },
  { id:'waardeaspecten', group:'Inrichting', title:'Waardeaspectentabel', ref:'§6.3.1, Bijlage A', color:'var(--muted)' },
  { id:'rollen', group:'Inrichting', title:'Rolverdeling', ref:'§4.7', color:'var(--muted)' },
  { id:'conditie', group:'Conditiemeting', title:'NEN 2767', ref:'NEN 2767-1', color:'#8e44ad' },
  { id:'iso', group:'Assetmanagementsysteem', title:'ISO 55000 / 55001', ref:'ISO 55000-reeks', color:'#2c3e50' },
];

/* ---------------- Sectoren (doelgroepen uit §4.2) ---------------- */
const SECTOREN = [
  {id:'leeg', naam:'Algemeen / zelf inrichten', niveaus:['Assetportfolio','Assetsysteem','Beheerobject','Element','Bouwdeel','Component'], vb:'bijv. portfolio → systeem → object → element → bouwdeel'},
  {id:'overheid', naam:'Rijk, provincie of gemeente', niveaus:['Areaal','Assetsysteem','Beheerobject','Element','Bouwdeel','Component'], vb:'bijv. Infra → Wegennet → Brug N201 → Onderbouw → Pijler'},
  {id:'waterschap', naam:'Waterschap of drinkwaterbedrijf', niveaus:['Areaal','Watersysteem','Kunstwerk','Element','Bouwdeel','Component'], vb:'bijv. Watersysteem → Polder X → Gemaal Y → Pomp 1'},
  {id:'haven', naam:'Havenbedrijf of luchthaven', niveaus:['Areaal','Complex','Beheerobject','Element','Bouwdeel','Component'], vb:'bijv. Kades → Kade 7 → Afmeervoorzieningen → Bolder'},
  {id:'commercieel', naam:'Commerciële of particuliere eigenaar', niveaus:['Vastgoedportefeuille','Complex','Gebouw','Element','Bouwdeel','Component'], vb:'bijv. Kantoren → Complex A → Gebouw 1 → Daken → Dakbedekking'},
  {id:'woning', naam:'Woningcorporatie', niveaus:['Woningbezit','Complex','Woongebouw','Element','Bouwdeel','Component'], vb:'bijv. Bezit → Complex 120 → Flat → Dak → Dakbedekking'},
  {id:'zorg', naam:'Zorginstelling', niveaus:['Zorgvastgoed','Locatie','Gebouw','Element','Bouwdeel','Component'], vb:'bijv. Locatie Noord → Hoofdgebouw → Transport → Lift'},
  {id:'onderwijs', naam:'Onderwijsinstelling', niveaus:['Onderwijsvastgoed','Locatie','Gebouw','Element','Bouwdeel','Component'], vb:'bijv. Campus → Gebouw B → Gevels → Metselwerk'},
];

/* ---------------- Methodekaart: stappen (eigen weergave van §4.8) ---------------- */
const STAPPEN = {
  b1:{t:'Organisatiedoelen, AM-beleid en portfolio samenstellen', lv:'bestuurlijk', rol:'AO', ref:'§5.3.2', mod:'bestuurlijk', scope:false,
      u:'De asset owner bepaalt waar de organisatie voor staat, geeft richting met assetmanagementbeleid en bepaalt welke assets tot het portfolio horen.'},
  b2:{t:'Portfolioperspectief formuleren', lv:'bestuurlijk', rol:'AO', ref:'§5.3.4', mod:'bestuurlijk', scope:false,
      u:'Een beeld van de gewenste toekomst van het portfolio. Dit voedt (indirect) de keuze voor gebruiksfase.'},
  b3:{t:'Portfoliobesluit nemen', lv:'bestuurlijk', rol:'AO', ref:'§5.3.4', mod:'bestuurlijk', scope:false,
      u:'Een besluit tot wijzigen (op- of afwaarderen, afstoten) brengt assets in de transitiefase.'},
  s1:{t:'Waardeaspecten bijeenbrengen', lv:'strategisch', rol:'AM', ref:'§4.6, H6', mod:'strategisch', scope:true,
      u:'De organisatie stelt haar eigen lijst van waardeaspecten samen. Die is het hulpmiddel om AM-doelstellingen op te stellen.'},
  s2:{t:'Assetmanagementdoelstellingen formuleren', lv:'strategisch', rol:'AM', ref:'§6.3.1', mod:'strategisch', scope:true,
      u:'Organisatiedoelen worden vertaald naar doelen voor de assets, vastgelegd in het SAMP.'},
  s3:{t:'Levensfasen vaststellen', lv:'strategisch', rol:'AM', ref:'§6.3.2', mod:'strategisch', scope:true,
      u:'Per assetsysteem of beheerobject: zit het in de gebruiksfase of in de transitiefase? Dat bepaalt welk spoor hieronder gevolgd wordt.'},
  pg:{t:'Gebruiksfase', lv:'strategisch', phase:true, ref:'§3.21, §4.4', mod:'basis', scope:true,
      u:'De asset is in gebruik en vervult de vereiste functie. Volg het linkerspoor: opstellen.'},
  pt:{t:'Transitiefase', lv:'strategisch', phase:true, ref:'§3.43, §4.4', mod:'basis', scope:true,
      u:'Er is besloten tot een wijziging die nog niet is uitgevoerd. Volg het rechterspoor: aanpassen en bijstellen.'},
  g1:{t:'Waardekompassen opstellen', lv:'tactisch', rol:'AM', ref:'§7.3.1', mod:'tactisch', scope:true,
      u:'Het hart van de methode: welke waardeaspecten spelen bij dit beheerobject of assettype, en hoe zwaar?'},
  g2:{t:'Instandhoudingseisen formuleren', lv:'tactisch', rol:'AM', ref:'§7.3.3', mod:'tactisch', scope:true,
      u:'Prestatie-eisen, eisen aan de fysieke staat en eisen aan esthetica/verzorging. Iteratief met de risicoanalyse.'},
  g3:{t:'Risicoanalyse uitvoeren', lv:'tactisch', rol:'AM', ref:'§7.3.4', mod:'tactisch', scope:true,
      u:'Wat gebeurt er als niet aan de eisen wordt voldaan? Uitkomst kan de eisen weer bijstellen (terugkoppeling).'},
  g4:{t:'Instandhoudingsconcepten opstellen', lv:'tactisch', rol:'AM', ref:'§7.3.5', mod:'tactisch', scope:true,
      u:'Hoe houden we het in stand: onderhoud (SAO/GAO/TAO), observaties, instructies, incident- en calamiteitenmanagement.'},
  g5:{t:'Uitvoeringseisen formuleren', lv:'tactisch', rol:'AM', ref:'§7.3.7', mod:'tactisch', scope:true,
      u:'Eisen aan de uitvoering, als basis voor de opdracht aan de serviceprovider.'},
  g6:{t:'Instandhoudingsplannen en begroting opstellen', lv:'tactisch', rol:'AM', ref:'§7.3.8', mod:'tactisch', scope:false,
      u:'Plannen en begroting volgen uit de eisen en concepten. Valt buiten het kader van de methode zelf.'},
  t1:{t:'Waardekompas aanpassen', lv:'tactisch', rol:'AM', ref:'§7.3.2', mod:'tactisch', scope:true,
      u:'Bij een op- of afwaarderingsbesluit wordt het waardekompas (tijdelijk) bijgesteld.'},
  t2:{t:'Instandhoudingseisen aanpassen', lv:'tactisch', rol:'AM', ref:'§7.3.3', mod:'tactisch', scope:true,
      u:'Eisen kunnen per levensfase verschillen, bijv. lagere eisen aan een gebouw dat wordt afgestoten.'},
  t3:{t:'Risicoanalyse actualiseren', lv:'tactisch', rol:'AM', ref:'§7.3.4', mod:'tactisch', scope:true,
      u:'Risico\'s opnieuw beoordelen in het licht van de komende wijziging.'},
  t4:{t:'Instandhoudingsconcepten bijstellen', lv:'tactisch', rol:'AM', ref:'§7.3.6', mod:'tactisch', scope:true,
      u:'Concept aanpassen aan de transitie, bijv. van TAO naar SAO bij naderende sloop.'},
  t5:{t:'Uitvoeringseisen bijstellen', lv:'tactisch', rol:'AM', ref:'§7.3.7', mod:'tactisch', scope:true,

const STORE_KEY = 'nen8026-tool-v1';
const DEFAULT = {sector:'leeg', rol:'alle', data:{assets:[], reg:{}, best:{}, info:{}}};
function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); return s ? {...DEFAULT, ...s, data:{...DEFAULT.data, ...(s.data||{})}} : structuredClone(DEFAULT); }
  catch(e){ return structuredClone(DEFAULT); }
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- Navigatie ---------------- */
function renderNav(active){
  const nv = rolNiveaus();
  let html = '', group = '';
  for(const m of MODULES){
    if(m.group !== group){ group = m.group; html += `<div class="group">${group}</div>`; }
    const dim = nv && m.group==='Niveaus' && !nv.includes(m.id);
    html += `<a href="#${m.id}" class="${m.id===active?'active':''} ${dim?'dim':''}">
      <span class="dot" style="background:${m.color}"></span>${m.title}</a>`;
  }
  nav.innerHTML = html;
}

}

const FASE_OPT = [['gebruik','Gebruiksfase','f-gebruik'],['op','Transitie – opwaarderen','f-op'],['af','Transitie – afwaarderen','f-af'],['weg','Afgestoten / gesloopt','f-weg']];
const uid = () => Math.random().toString(36).slice(2,9);
function children(pid){ return state.data.assets.filter(a=>a.parent===pid); }
function renderTree(pid, depth){
  return children(pid).map(a=>{
    const f = FASE_OPT.find(x=>x[0]===a.fase)||FASE_OPT[0];
    const lv = sector().niveaus[Math.min(a.niveau,5)];
    return `<div class="node ${ui.node===a.id?'sel':''}" data-node="${a.id}" style="padding-left:${8+depth*20}px">
      <span class="lv">${esc(lv)}</span><span>${esc(a.naam)||'<i class="muted">(naamloos)</i>'}</span>
      ${a.krit?`<span class="small muted">K${a.krit}</span>`:''}${perspectiefVoor(a.id)?`<span class="fase" style="background:#f3ecf6;color:#7a4b8c;margin-left:auto" title="Er is een perspectief aangekondigd (§5.3.4)">◷ perspectief</span>`:''}<span class="fase ${f[2]}" ${perspectiefVoor(a.id)?'style="margin-left:4px"':''}>${f[1].replace('Transitie – ','↗ ').replace('↗ afwaarderen','↘ afwaarderen')}</span></div>`
      + renderTree(a.id, depth+1);
  }).join('');
}
function renderAssets(){

  const form = a ? `<div class="panel form">
      <h3>${esc(s.niveaus[Math.min(a.niveau,5)])}</h3>
      <div><label>Naam</label><input data-f="naam" value="${esc(a.naam)}"></div>

      <div><label>Levensfase (§4.4)</label><select data-f="fase">${FASE_OPT.map(o=>`<option value="${o[0]}" ${a.fase===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
      ${a.fase==='op'||a.fase==='af'?`<div><label>Toelichting besluit / aanleiding transitie</label><textarea data-f="toelichting" rows="2">${esc(a.toelichting||'')}</textarea></div>`:''}
      ${a.niveau>=4?`<div class="panel small" style="background:var(--l4s);border-color:transparent;display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="grid-column:1/-1"><b>${a.niveau===4?'Bouwdeel':'Component'} — gegevens voor de conditiemeting (NEN 2767)</b></div>
        <div><label>Materiaalsoort</label><input data-f="materiaal" value="${esc(a.materiaal||'')}" placeholder="bijv. bitumineus, metselwerk, staal"></div>
        <div><label>Elementcode uit de gebrekenbibliotheek</label><input data-f="code" value="${esc(a.code||'')}" placeholder="koppel via NEN 2767 › Decompositie"><div class="small muted">${esc(bibElement(a.code)?.oms||'')}</div></div>
        <div><label>Hoeveelheid</label><input data-f="hoeveelheid" value="${esc(a.hoeveelheid||'')}" placeholder="bijv. 450"></div>
        <div><label>Eenheid</label><input data-f="eenheid" value="${esc(a.eenheid||'')}" placeholder="m², m¹, st"></div>
        <div><label>Vervangingswaarde (€)</label><input data-f="vervangingswaarde" value="${esc(a.vervangingswaarde||'')}"></div>
        <div><label>Bouw-/installatiejaar</label><input data-f="bouwjaar" value="${esc(a.bouwjaar||'')}"></div>

      <div><label>Kriticiteit (§3.28) – 1 laag … 5 zeer kritiek</label><div class="krit">${[1,2,3,4,5].map(k=>`<button data-krit="${k}" class="${a.krit===k?'on':''}">${k}</button>`).join('')}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${a.niveau<5?`<button class="primary" data-add="${a.id}">+ ${esc(s.niveaus[a.niveau+1])} toevoegen</button>`:''}
        <button class="danger ${ui.armed?'armed':''}" data-del="${a.id}">${ui.armed?'Klik nogmaals om te verwijderen (incl. onderliggend)':'Verwijderen'}</button>
      </div></div>`
    : `<div class="panel"><p class="muted" style="margin:0">Selecteer links een object, of begin met een nieuw ${esc(s.niveaus[0].toLowerCase())}.</p></div>`;
  return `<h2>Assetstructuur</h2>
    <div class="ref">Portfolio → systeem → beheerobject → onderdeel · zie NEN 8026 §3.10–3.14 · sector: ${esc(s.naam)} (${esc(s.vb)})</div>

      <div>${form}</div>
    </div>
    <p class="small muted">De benaming van de niveaus past zich aan aan de gekozen sector. Kriticiteit en levensfase worden later gebruikt in het waardekompas en de risicoanalyse.</p>`;
}

  return `<div class="pick">${rows.map(([a,d])=>`<label style="padding-left:${d*16}px"><input type="checkbox" ${name} data-rv="${a.id}" ${(sel||[]).includes(a.id)?'checked':''}> ${esc(a.naam)||'(naamloos)'} <span class="small muted">${esc(sector().niveaus[Math.min(a.niveau,5)])}</span></label>`).join('')}</div>`;

function fieldHtml(key, it, f){
  const a = `data-rk="${key}" data-rid="${it.id}" data-rf="${f.k}"`; const v = it[f.k];
  let inp;

  else if(f.type==='textarea') inp = `<textarea ${a} rows="3">${esc(v)}</textarea>`;
  else if(f.type==='date') inp = `<input type="date" ${a} value="${esc(v)}">`;
  else if(f.type==='select') inp = `<select ${a} ${it.vast&&f.k==='relevant'?'disabled':''}><option value="">— kies —</option>${(f.optsFn?f.optsFn():f.opts).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(f.type==='checks') inp = `<div class="pick">${(f.optsFn?f.optsFn():f.opts).map(o=>`<label><input type="checkbox" ${a} data-rv="${esc(o)}" ${(v||[]).includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`;
  else if(f.type==='assets') inp = assetPicker(v, a, f.max);
  else if(f.type==='refsel'){ const src = items(f.ref);
    inp = `<select ${a}><option value="">— kies —</option>${src.map(o=>`<option value="${o.id}" ${v===o.id?'selected':''}>${esc(REG[f.ref].label(o)||'(naamloos)')}</option>`).join('')}</select>`
      + (src.length?'':`<div class="small muted">Nog niets ingevoerd bij ${mv(f.ref)}.</div>`); }
  else if(f.type==='ref'){ const src = items(f.ref);
    inp = src.length ? `<div class="pick">${src.map(o=>`<label><input type="checkbox" ${a} data-rv="${o.id}" ${(v||[]).includes(o.id)?'checked':''}> ${esc(REG[f.ref].label(o)||'(naamloos)')}</label>`).join('')}</div>`
      : `<p class="small muted" style="margin:0">Nog niets ingevoerd bij ${mv(f.ref)}.</p>`; }

/* ---------- Risico-evaluatie: kans × effect per waardeaspect, getoetst aan grens per bijdrage ---------- */
function risicoEval(r){
  const c = items('clusters').find(x=>x.id===r.cluster); const k = +r.kans; if(!k) return null;
  const f = faseKey(r.fase); let max = 0, ok = true, kritiek = null;
  for(const [aid, e] of Object.entries(r.effect||{})){ if(!e) continue;
    const b = bijdrage(c, aid, f); const s = k*+e; if(s>max){max=s;}
    if(b===0) continue; const g = rgrens()[b]; if(s>g){ ok=false; if(!kritiek||s>kritiek.s) kritiek={aid,s,g,b}; } }

}
const kleur = s => s>=15?'#c0392b':s>=8?'#e67e22':s>=4?'#f1c40f':'#7cb342';

/* ---------- Spinwebdiagram (eigen weergave) ---------- */
function radar(axes, series, size=340){
  const n = axes.length; if(n<3) return `<p class="small muted">Minimaal 3 relevante waardeaspecten nodig voor een spinweb.</p>`;
  const padX = 90, W = size+2*padX; const cx=W/2, cy=size/2, R=size/2-45;
  const pt = (i,v)=>{ const a = -Math.PI/2 + i*2*Math.PI/n; return [cx+Math.cos(a)*R*v/3, cy+Math.sin(a)*R*v/3]; };
  let g = '';
  for(let l=1;l<=3;l++) g += `<polygon points="${axes.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="#dde2df"/>`;
  axes.forEach((a,i)=>{ const [x,y]=pt(i,3); const [lx,ly]=pt(i,3.35);
    g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e6eae8"/>`;
    g += `<text x="${lx}" y="${ly}" font-size="11" text-anchor="${Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end'}" dominant-baseline="middle" fill="#3b4642">${esc(a)}</text>`; });
  for(let l=0;l<=3;l++) g += `<text x="${cx+3}" y="${cy-R*l/3-2}" font-size="9" fill="#9aa5a0">${l}</text>`;
  for(const s of series){
    g += `<polygon points="${s.vals.map((v,i)=>pt(i,v).join(',')).join(' ')}" fill="${s.fill||'none'}" stroke="${s.color}" stroke-width="2.2" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    s.vals.forEach((v,i)=>{ const [x,y]=pt(i,v); g += `<circle cx="${x}" cy="${y}" r="3" fill="${s.color}"/>`; });
  }
  return `<svg viewBox="0 0 ${W} ${size}" style="width:100%;max-width:${W}px">${g}</svg>`;
}
function kompasRadar(c, f, compare, size){
  const asp = aspectsFor(c); const series = [];
  if(compare && f!=='gebruik') series.push({vals:asp.map(a=>bijdrage(c,a.id,'gebruik')), color:'#9aa5a0', dash:true});
  series.push({vals:asp.map(a=>bijdrage(c,a.id,f)), color: f==='gebruik'?'#2d5f9a':f==='op'?'#3d7a26':'#b5651d', fill: f==='gebruik'?'rgba(45,95,154,.12)':f==='op'?'rgba(61,122,38,.12)':'rgba(181,101,29,.12)'});
  return radar(asp.map(a=>a.naam), series, size);
}

/* ---------- Signalen "kompas bijstellen" (§7.3.2) ---------- */
function kompasSignalen(c){
  const s = []; const meta = c.kmeta||{};
  if(!meta.gebruik) s.push('Waardekompas voor de gebruiksfase is nog niet vastgesteld.');
  const objs = state.data.assets.filter(a=>(c.objecten||[]).includes(a.id));
  for(const f of ['op','af']) if(objs.some(a=>a.fase===f) && !meta[f]) s.push(`Er zijn objecten in transitie (${f==='op'?'opwaarderen':'afwaarderen'}) maar er is geen vastgesteld transitiekompas.`);
  const laatst = Math.min(...Object.values(meta).map(m=>m.ts).filter(Boolean));
  if(isFinite(laatst)){
    if(items('amdoelen').some(d=>(d._t||0)>laatst) || items('doelen').some(d=>(d._t||0)>laatst) || items('waardeaspecten').filter(w=>aspectsFor(c).some(a=>a.id===w.id)).some(d=>(d._t||0)>laatst))
      s.push('Er zijn nieuwe of aangepaste doelstellingen of waardeaspecten sinds de laatste vaststelling.');
    if(objs.some(a=>(a._ft||0)>laatst)) s.push('Een object in dit cluster is van levensfase gewisseld sinds de laatste vaststelling.');
  }
  return s;
}

function risicoMatrix(){

function laadVoorbeeld(key){
  laadBijlageA(); const v = VB[key];
  for(const [val, names] of Object.entries(v.relevant)) for(const n of names){ const w = aspectId(n); if(!w.relevant) w.relevant = val; if(w.vast) w.relevant='Ja'; }
  const ts = Date.now(), datum = new Date().toISOString().slice(0,10);
  for(const vc of v.clusters){
    if(items('clusters').some(c=>c.naam===vc.naam)) continue;
    const c = {id:uid(), naam:vc.naam, assettypen:vc.assettypen, basis:vc.basis, omschrijving:'Voorbeeld gebaseerd op NEN 8026 Bijlage '+key+' (waarden uit de norm, toelichtingen in eigen woorden).'+(vc.tfase?' De richting van de transitie wordt in het voorbeeld niet genoemd; hier opgenomen als afwaarderen.':''), objecten:[], kompas:{}, kmeta:{}, khist:{}};
    for(const f of ['gebruik','op','af']){ if(!vc[f]) continue;
      if(f!=='gebruik' && !Object.keys(vc[f]).length) continue;
      c.kompas[f] = {}; for(const [n,val] of Object.entries(vc[f])){ const w = aspectId(n); const [x,t] = Array.isArray(val)?val:[val,'']; c.kompas[f][w.id] = {w:x, t}; }
      if(Object.keys(c.kompas[f]).length){ c.kmeta[f] = {ts, datum, reden:'Voorbeeld uit Bijlage '+key, ao:false}; c.khist[f] = [c.kmeta[f]]; }
    }
    c.aspecten = [...new Set(Object.values(c.kompas).flatMap(k=>Object.keys(k)))];
    if(vc.tfase && !Object.keys(c.kompas.gebruik||{}).length){ delete c.kompas.gebruik; delete c.kmeta.gebruik; }
    items('clusters').push(c);
  }
  save();
}

/* ---------- Voorstel onderhoudsconcept + signaal bijstellen ---------- */
function conceptVoorstel(c, f){
  if(!c) return null;
  const objs = state.data.assets.filter(a=>(c.objecten||[]).includes(a.id));
  const krit = Math.max(0,...objs.map(a=>a.krit||0));
  const risk = items('risicos').filter(r=>r.cluster===c.id).map(risicoEval).filter(Boolean);
  const hoogFunc = aspectsFor(c).filter(a=>a.thema==='Functionaliteit').some(a=>bijdrage(c,a.id,f)===3);
  const laagFunc = aspectsFor(c).filter(a=>a.thema==='Functionaliteit' && !/compliance/i.test(a.naam)).every(a=>bijdrage(c,a.id,f)<=1);
  if(risk.some(r=>!r.ok)) return ['TAO – toestandsafhankelijk','er zijn niet-acceptabele risico\'s: ingrijpen vóór het verwachte faalmoment.'];
  if(krit>=4 || hoogFunc) return ['TAO – toestandsafhankelijk', krit>=4?`hoge kriticiteit (K${krit}).`:'hoge bijdrage op een functioneel waardeaspect.'];
  if(laagFunc && krit<=2) return ['SAO – storingsafhankelijk','lage functionele bijdragen en geen kritieke objecten (SAO is doorgaans alleen voor niet-kritieke assets, §3.40).'];
  return ['GAO – gebruiksduurafhankelijk','gangbare bijdragen; onderhoud op basis van gebruiksduur ligt voor de hand.'];
}
function conceptSignaal(it){
  const c = items('clusters').find(x=>x.id===it.cluster); if(!c) return null; const t = it._t||0;
  if((c.kchanged||0)>t) return 'Het waardekompas is aangepast na de laatste wijziging van dit concept.';
  if(items('eisen').some(e=>e.cluster===c.id && (e._t||0)>t)) return 'Er zijn instandhoudingseisen aangepast na de laatste wijziging van dit concept.';
  return null;
}
function conceptExtra(it){
  const c = items('clusters').find(x=>x.id===it.cluster); const v = conceptVoorstel(c, faseKey(it.fase)); const sig = conceptSignaal(it);
  return `${sig?`<div class="warn small" style="margin:0">⚠ Bijstellen nodig (§7.3.6): ${sig}</div>`:''}
    ${v?`<div class="panel small" style="background:var(--l3s);border-color:transparent">Voorstel van de tool voor het onderhoudsconcept: <b>${v[0]}</b> — ${v[1]}
      ${it.onderhoud!==v[0]?`<button data-cvoorstel="${it.id}" data-cv="${v[0]}" style="font-size:12px;padding:2px 8px;margin-left:6px">Neem over</button>`:' ✓'}</div>`:''}`;
}

/* ---------- Jaargrafiek plannen & begroting ---------- */
function jaarGrafiek(list){
  const per = {}; for(const m of list){ const j = parseInt(m.jaar); const k = num(m.kosten); if(j && k) per[j] = (per[j]||0)+k; }
  const jaren = Object.keys(per).map(Number); if(!jaren.length) return `<p class="small muted">Nog geen maatregelen met jaar en kosten.</p>`;
  const start = Math.min(new Date().getFullYear(), ...jaren), eind = Math.max(start+9, ...jaren);
  const ys = []; for(let y=start;y<=eind;y++) ys.push(y);
  const max = Math.max(...ys.map(y=>per[y]||0)); const gem = ys.reduce((s,y)=>s+(per[y]||0),0)/ys.length;
  const W = 640, H = 200, bw = (W-40)/ys.length;
  let g = `<line x1="36" y1="${H-24-(gem/max)*(H-40)}" x2="${W}" y2="${H-24-(gem/max)*(H-40)}" stroke="#9aa5a0" stroke-dasharray="4 4"/><text x="${W-2}" y="${H-28-(gem/max)*(H-40)}" font-size="10" text-anchor="end" fill="#5f6b66">gemiddeld</text>`;
  ys.forEach((y,i)=>{ const v = per[y]||0; const h = max? v/max*(H-40):0; const piek = v>1.5*gem;
    g += `<rect x="${40+i*bw+3}" y="${H-24-h}" width="${bw-6}" height="${h}" rx="3" fill="${piek?'#b5651d':'#1f6f5c'}"><title>${y}: € ${v.toLocaleString('nl-NL')}</title></rect>
      <text x="${40+i*bw+bw/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="#5f6b66">${y}</text>`; });
  const pieken = ys.filter(y=>(per[y]||0)>1.5*gem);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${g}</svg>
    <p class="small muted" style="margin:4px 0 0">Totaal € ${ys.reduce((s,y)=>s+(per[y]||0),0).toLocaleString('nl-NL')} over ${ys.length} jaar · gemiddeld € ${Math.round(gem).toLocaleString('nl-NL')} per jaar.
    ${pieken.length?`<b style="color:#b5651d">Piek(en) in ${pieken.join(', ')}</b> — overweeg spreiding (voorspelbaarheid en budgetrust voor de asset owner).`:'Geen uitschieters boven 1,5× het gemiddelde.'}</p>`;
}

/* ==================================================================
   NEN 2767 — REKENHART (H5, Bijlage B, Bijlage F)
   De rekentabellen (tabel 3, 5, B.1, B.2) staan NIET in de code:
   de gebruiker vult ze in of importeert ze (licentie NEN 2767).
   ================================================================== */
const ERNST = [['gering','Gering'],['serieus','Serieus'],['ernstig','Ernstig']];
const INTENS = ['','Beginstadium','Gevorderd stadium','Eindstadium'];
const OMVNAAM = ['','Incidenteel','Plaatselijk','Regelmatig','Aanzienlijk','Algemeen'];
function T27(){ return (state.data.n2767 ||= {omvang:['','','',''], matrix:{gering:[[],[],[]],serieus:[[],[],[]],ernstig:[[],[],[]]}, b1:['','','','','',''], b2:['','','','',''], vervalMax:'4', enkel:'5.2'}); }
const isNum = v => v!=='' && v!==null && v!==undefined && !isNaN(+String(v).replace(',','.'));
const nr = v => +String(v).replace(',','.');
function tabellenCompleet(){
  const t = T27(); const cells = [];
  for(const [e] of ERNST) for(let i=0;i<3;i++) for(let k=0;k<5;k++) cells.push((t.matrix[e][i]||[])[k]);
  return [...t.omvang, ...t.b1, ...t.b2, ...cells].every(isNum);
}
const omvKlasse = p => { const o = T27().omvang.map(nr); return p<o[0]?1 : p<o[1]?2 : p<o[2]?3 : p<o[3]?4 : 5; };
const matrix = (e,i,k) => nr(T27().matrix[e][i-1][k-1]);
const factorB1 = c => nr(T27().b1[c-1]);
const condB2 = u => { const t = T27().b2.map(nr); u = Math.round(u*10000)/10000; for(let i=0;i<5;i++) if(u<=t[i]) return i+1; return 6; };
/* Verouderingskromme (formule 1 en 2 uit §5.4) */
const krommeC = x => x<=0 ? 1 : x>=1 ? Infinity : 1 - Math.log2(1-x);
const krommeT = (C, L) => L - L*Math.pow(0.5, C-1);

/* Rekenmotor: één bouwdeel. input = {vw, gebreken:[{id,oms,ernst,int,omv,comp:{naam,vw}|null,cpct,stapel,auto}]} */
function berekenBouwdeel(inp){
  if(!tabellenCompleet()) return {error:'De rekentabellen zijn nog niet (volledig) ingevuld. Ga naar ⚙ Rekentabellen.'};
  const warn = []; const vwBd = num(inp.vw);
  const rows = (inp.gebreken||[]).filter(g=>g.ernst && g.int && isNum(g.omv)).map(g=>{
    let compPct = 100, vwComp = null;
    if(g.comp){ vwComp = num(g.comp.vw);
      if(vwComp && vwBd) compPct = vwComp/vwBd*100;
      else if(isNum(g.cpct)) compPct = nr(g.cpct);
      else warn.push(`Component "${g.comp.naam}": geen vervangingswaarde of percentage — gerekend als 100 % van het bouwdeel.`); }
    const omvComp = Math.min(100, Math.max(0, nr(g.omv)));
    const omv3d = compPct*omvComp/100;
    const c4a = matrix(g.ernst, +g.int, omvKlasse(omvComp));
    const c4b = matrix(g.ernst, +g.int, 5);
    return {g, comp:g.comp, vwComp, compPct, omvComp, omv3d, c4a, c4b, f:factorB1(c4b), excluded:false};
  });
  const onvolledig = (inp.gebreken||[]).length - rows.length;
  if(onvolledig>0) warn.push(`${onvolledig} gebrek(en) niet meegeteld: ernst, intensiteit of omvang ontbreekt.`);
  // §5.3 situatie 1: gestapelde gebreken → alleen het gebrek met de slechtste conditie telt
  const groep = r => r.g.stapel && rows.some(x=>x.g.id===r.g.stapel) ? r.g.stapel : r.g.id;
  const groepen = {}; rows.forEach(r=>{ (groepen[groep(r)] ||= []).push(r); });
  for(const leden of Object.values(groepen)) if(leden.length>1){
    const best = leden.slice().sort((a,b)=>b.c4b-a.c4b || b.omv3d-a.omv3d)[0];
    leden.forEach(r=>{ if(r!==best) r.excluded = true; });
  }
  const eff = rows.filter(r=>!r.excluded);
  const somOmv = eff.reduce((s,r)=>s+r.omv3d,0);
  if(somOmv>100.0001) warn.push(`De gebreken beslaan samen ${somOmv.toFixed(1)} % van het bouwdeel (meer dan 100 %). Controleer de omvang of markeer gestapelde gebreken.`);
  const rest = Math.max(0, 100-somOmv);
  const corr = eff.reduce((s,r)=>s+r.omv3d*r.f,0) + rest*1;
  const uitkomstB = corr/100; const condB = condB2(uitkomstB);
  const base = {rows, eff, rest, corr, uitkomstB, condB, warn, somOmv};
  if(!eff.length) return {...base, cond:1, methode:'geen', uitleg:'Geen gebreken geconstateerd: conditiescore 1 (bouwdelen zonder gebreken tellen mee, §3.7).', factor:1};
  if(eff.length===1){
    const r = eff[0]; const c52 = matrix(r.g.ernst, +r.g.int, omvKlasse(r.omv3d));
    if(T27().enkel==='B') return {...base, cond:condB, methode:'B', factor:uitkomstB, alt:c52, uitleg:`Eén gebrek, berekend met de rekenmethodiek van Bijlage B (zo ingesteld). Volgens §5.2 zou de score ${c52} zijn.`};
    return {...base, cond:c52, methode:'5.2', factor:factorB1(c52), alt:condB, uitleg:`Eén gebrek: conditie direct uit de matrix (§5.2) met omvang ${r.omv3d.toFixed(1)} % (${OMVNAAM[omvKlasse(r.omv3d)].toLowerCase()}). Ter vergelijking: Bijlage B geeft ${condB}.`};
  }
  const e0 = eff[0];
  if(eff.every(r=>r.g.ernst===e0.g.ernst && +r.g.int===+e0.g.int)){
    const c = matrix(e0.g.ernst, +e0.g.int, omvKlasse(somOmv));
    return {...base, cond:c, methode:'5.3-2', factor:factorB1(c), alt:condB, uitleg:`§5.3 situatie 2: gebreken met dezelfde ernst en intensiteit op verschillende gedeelten. De omvang wordt opgeteld (${somOmv.toFixed(1)} %, ${OMVNAAM[omvKlasse(somOmv)].toLowerCase()}) en de conditie volgt uit de matrix.`};
  }
  return {...base, cond:condB, methode:'B', factor:uitkomstB, uitleg:`§5.3 situatie 3: verschillende gebreken op verschillende gedeelten. Berekend met de zeven stappen van Bijlage B: uitkomst ${uitkomstB.toFixed(3).replace('.',',')} → conditie ${condB} (tabel B.2).`};
}

const ckleur = c => (CSCHAAL[c-1]||CSCHAAL[0])[3];
function calcVisual(res){

  const parts1 = res.eff.map((r,i)=>({w:r.omv3d, c:ckleur(r.c4b), dark:r.c4b>=4, l:`${i+1}`, t:`${r.g.oms||'gebrek'}: ${r.omv3d.toFixed(1)} % · conditie ter plaatse ${r.c4b}`})).concat([{w:res.rest, c:'#e8f1e8', l:'geen gebrek', t:`Geen gebrek: ${res.rest.toFixed(1)} %`}]);
  const parts2 = res.eff.map((r,i)=>({w:r.omv3d*r.f, c:ckleur(r.c4b), dark:r.c4b>=4, l:`${i+1}`, t:`${r.g.oms||'gebrek'}: ${r.omv3d.toFixed(1)} % × ${r.f} = ${(r.omv3d*r.f).toFixed(1)} %`})).concat([{w:res.rest, c:'#e8f1e8', l:'× 1', t:`Geen gebrek: ${res.rest.toFixed(1)} % × 1`}]);
  g += bar('Bouwdeel', 'omvang (stap 3d)', parts1, y);
  g += bar('Gecorrigeerd', 'omvang × factor (stap 6)', parts2, y+56);
  const x100 = x0 + 100*scale;
  g += `<line x1="${x100}" y1="${y-8}" x2="${x100}" y2="${y+98}" stroke="#1d2321" stroke-dasharray="4 3"/><text x="${x100}" y="${y-12}" text-anchor="middle" font-size="10.5" fill="#1d2321">100 %</text>`;
  g += `<text x="${x0+res.corr*scale}" y="${y+104}" text-anchor="end" font-size="11" font-weight="600" fill="#1d2321">${res.corr.toFixed(1)} %</text>`;
  // meter tabel B.2
  const gy = y+132, gx0 = x0, gw = bw, umin = 1, umax = 2.1; const t = T27().b2.map(nr);
  const X = u => gx0 + (Math.min(umax,Math.max(umin,u))-umin)/(umax-umin)*gw;
  const edges = [umin, ...t, umax];
  g += `<text x="${x0-10}" y="${gy+15}" text-anchor="end" font-size="12" font-weight="600" fill="#1d2321">Uitkomst</text><text x="${x0-10}" y="${gy+29}" text-anchor="end" font-size="10.5" fill="#5f6b66">tabel B.2 (stap 7)</text>`;
  for(let c=1;c<=6;c++){ const a = X(edges[c-1]), b = X(edges[c]); g += `<rect x="${a}" y="${gy}" width="${Math.max(0,b-a)}" height="22" fill="${ckleur(c)}" opacity=".85"/><text x="${(a+b)/2}" y="${gy+15}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${c}</text>`; }
  t.forEach((v,i)=>{ g += `<text x="${X(v)}" y="${gy+36+(i%2)*11}" text-anchor="middle" font-size="9.5" fill="#5f6b66">${String(v).replace('.',',')}</text>`; });
  const mx = X(res.uitkomstB);
  g += `<path d="M${mx} ${gy-2} l-7 -12 h14 z" fill="#1d2321"/><text x="${mx}" y="${gy-18}" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2321">${res.uitkomstB.toFixed(3).replace('.',',')}</text>`;
  return `<svg viewBox="0 0 ${W} ${gy+58}" style="width:100%;max-width:${W}px">${g}</svg>`;
}

let condCache = new Map();
const opnames = () => (state.data.opname ||= {});
function bdInput(bd, op, insp){
  const comps = state.data.assets.filter(a=>a.parent===bd.id);
  const gebreken = (op.gebreken||[]).map(g=>({...g, comp: g.comp ? (a=>a?{naam:a.naam||'(component)', vw:a.vervangingswaarde}:null)(comps.find(c=>c.id===g.comp)) : null}));
  if(op.status==='vangnet'){
    const v = vervalVoor(bd, insp);
    if(v.int) gebreken.push({id:'verval', oms:'Verval (vangnet, Bijlage F)', ernst:'gering', int:v.int, omv: isNum(op.vervalOmv)?op.vervalOmv:vervalStandaard(bd, gebreken), comp:null, auto:true});
  }
  return {vw: bd.vervangingswaarde, gebreken};
}
function vervalStandaard(bd, gebreken){
  if(!gebreken.length || !tabellenCompleet()) return 100;
  const r = berekenBouwdeel({vw:bd.vervangingswaarde, gebreken}); return Math.max(0, Math.round((100 - (r.somOmv||0))*10)/10);
}
function vervalVoor(bd, insp){
  const L = num(bd.levensduur), bj = num(bd.bouwjaar); if(!L || !bj) return {int:0, msg:'Vul bouwjaar en technische levensduur in om het vangnet te kunnen toepassen.'};
  const jaar = insp?.datum ? +insp.datum.slice(0,4) : new Date().getFullYear();
  const x = (jaar-bj)/L; let int = x>=0.875?3 : x>=0.75?2 : x>=0.5?1 : 0;
  const cap = {'2':1,'3':2,'4':3}[T27().vervalMax||'4']; const gecapt = int>cap; int = Math.min(int, cap);
  return {int, x, msg:`Leeftijd ${jaar-bj} jaar = ${Math.round(x*100)} % van de levensduur (${L} jaar) → ${int?'verval gering, '+INTENS[int].toLowerCase():'nog geen verval (< 50 %)'}${gecapt?` (begrensd door instelling: verval tot conditie ${T27().vervalMax})`:''}.`};
}
function bdConditie(bd){
  if(condCache.has(bd.id)) return condCache.get(bd.id);
  const insps = items('inspecties').slice().sort((a,b)=>(b.datum||'').localeCompare(a.datum||''));
  let out = null;
  for(const i of insps){ const op = opnames()[i.id]?.[bd.id]; if(op && (op.status==='geinsp'||op.status==='vangnet')){ const res = berekenBouwdeel(bdInput(bd, op, i)); if(!res.error) out = {res, insp:i}; break; } }
  condCache.set(bd.id, out); return out;
}
const bouwdelenOnder = id => { const out = []; const walk = pid => children(pid).forEach(a=>{ if(a.niveau===4) out.push(a); else if(a.niveau<4) walk(a.id); }); const a = state.data.assets.find(x=>x.id===id); if(a?.niveau===4) return [a]; walk(id); return out; };
function aggregeer(bds){
  let som = 0, vw = 0, zonderVw = 0, zonderCond = 0, n = 0;
  for(const bd of bds){ const c = bdConditie(bd); if(!c){ zonderCond++; continue; } const v = num(bd.vervangingswaarde); if(!v){ zonderVw++; continue; } som += v*c.res.factor; vw += v; n++; }
  if(!vw) return {n, zonderVw, zonderCond, totaal:bds.length};
  const u = som/vw; return {cond:condB2(u), uitkomst:u, vw, n, zonderVw, zonderCond, totaal:bds.length};
}

function parseCSV(txt){
  const lines = txt.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim()); const sep = (lines[0].match(/;/g)||[]).length >= (lines[0].match(/,/g)||[]).length ? ';' : ',';
  const split = l => { const out = []; let cur = '', q = false; for(const ch of l){ if(ch==='"'){ q = !q; continue; } if(ch===sep && !q){ out.push(cur); cur=''; } else cur += ch; } out.push(cur); return out.map(x=>x.trim()); };
  const h = split(lines[0]).map(x=>x.toLowerCase()); return lines.slice(1).map(l=>{ const v = split(l); const o = {}; h.forEach((k,i)=>o[k]=v[i]||''); return o; });
}
function importBib(txt, naam){
  let B;
  if(/^\s*[\[{]/.test(txt)){ B = JSON.parse(txt); if(B.type!=='nen2767-gebrekenbibliotheek') throw new Error('type'); }
  else { const rows = parseCSV(txt);
    B = bib().secties ? JSON.parse(JSON.stringify(bib())) : {type:'nen2767-gebrekenbibliotheek', dataset:naam.replace(/\.(csv|txt)$/i,''), secties:[]};
    const get = r => { let s = B.secties.find(x=>x.code===r.sectie); if(!s){ s = {code:r.sectie||'?', disc:r.discipline||'', titel:r.sectietitel||r.sectie||'', elementen:[], levensduur:[], gebreken:[]}; B.secties.push(s); } return s; };
    if(rows[0] && 'element_code' in rows[0]) rows.forEach(r=>{ const s = get(r); if(!s.elementen.some(e=>e.code===r.element_code)) s.elementen.push({code:r.element_code, oms:r.omschrijving||'', materiaal:r.materiaal||''}); });
    else { const nieuw = new Set();
      rows.forEach(r=>{ const s = get(r); if(!nieuw.has(s.code)){ s.gebreken = []; nieuw.add(s.code); } const e = (r.ernst||'').toLowerCase();
        s.gebreken.push({code:r.gebrek_code||'', ernst:e.startsWith('ern')?'ernstig':e.startsWith('ser')?'serieus':'gering', soort:r.soort||'', naam:r.gebrek||r.volledige_tekst||'', oms:r.volledige_tekst||r.gebrek||'', int:+r.intensiteit_vast||'', omvang:r.omvang_aanwijzing||''}); }); } }
  state.data.bib = B; bibIndex = null;
  if(!items('datasets').some(d=>d.naam===B.dataset)){ items('datasets').forEach(d=>d.actief='Nee'); items('datasets').push({id:uid(), naam:B.dataset, actief:'Ja', toelichting:'Geïmporteerd als gebrekenbibliotheek.'}); }
  save();
}
function exportBibCSV(){
  const rows = [['sectie','discipline','sectietitel','gebrek_code','ernst','soort','gebrek','intensiteit_vast','omvang_aanwijzing','volledige_tekst']];
  bib().secties.forEach(s=>s.gebreken.forEach(g=>rows.push([s.code,s.disc,s.titel,g.code,g.ernst,g.soort,g.naam,g.int,g.omvang,g.oms])));
  const csv = '﻿'+rows.map(r=>r.map(v=>/[;"\n]/.test(String(v))?'"'+String(v).replace(/"/g,'')+'"':v).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'gebrekenbibliotheek.csv'; a.click();

function dbIndex(){ const D = dbib(); if(!D) return null; if(dbIdx) return dbIdx;

  const elBo = D.el.map(()=>[]); D.bo.forEach((b,bi)=>b.el.forEach(e=>elBo[e].push(bi)));

    const losEl = D.el.filter((e,i)=>!I.elBo[i].length), losBd = D.bd.filter((b,i)=>!I.bdEl[i].length), gbLos = D.gb.filter((g,i)=>!I.bdGb[i]);

/* ---------- Tab: condities (aggregatie §5.5) ---------- */
function tCondities(){
  if(!tabellenCompleet()) return `<div class="warn small">Rekentabellen nog niet compleet — <a href="#conditie" data-ctab="tabellen">vul ze in</a>.</div>`;
  const allBd = state.data.assets.filter(a=>a.niveau===4);
  const dist = [0,0,0,0,0,0]; let vwTot = 0;
  allBd.forEach(b=>{ const c = bdConditie(b); const v = num(b.vervangingswaarde); if(c && v){ dist[c.res.cond-1] += v; vwTot += v; } });
  const distBar = vwTot ? `<div style="display:flex;height:28px;border-radius:6px;overflow:hidden">${dist.map((v,i)=>v?`<div style="width:${v/vwTot*100}%;background:${ckleur(i+1)};color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center" title="Conditie ${i+1}: € ${v.toLocaleString('nl-NL')} (${Math.round(v/vwTot*100)} %)">${v/vwTot>0.06?i+1:''}</div>`:'').join('')}</div>
    <p class="small muted" style="margin:4px 0 0">Verdeling van de vervangingswaarde (€ ${vwTot.toLocaleString('nl-NL')}) over de conditiescores.</p>` : '<p class="small muted">Nog geen bouwdelen met conditie én vervangingswaarde.</p>';
  const rows = []; const walk = (pid,d)=>children(pid).forEach(a=>{ if(a.niveau<=4){ rows.push([a,d]); walk(a.id,d+1); } }); walk(null,0);
  const tree = rows.map(([a,d])=>{
    if(a.niveau===4){ const c = bdConditie(a); return `<tr style="border-top:1px solid var(--line)"><td style="padding:5px 6px;padding-left:${6+d*16}px">${esc(a.naam)} <span class="small muted">bouwdeel</span></td><td>${cbadge(c?.res.cond)}</td><td>${(w=>w?cbadge(+w.v):'')(extraWaarde(a,'verz'))}</td><td class="small">${c?c.res.factor.toFixed(3).replace('.',','):''}</td><td class="small">${a.vervangingswaarde?'€ '+num(a.vervangingswaarde).toLocaleString('nl-NL'):'<span style="color:#b5651d">geen vw</span>'}</td><td class="small muted">${c?esc(c.insp.titel||'')+(c.insp.datum?' · '+c.insp.datum:''):'geen inspectie'}</td></tr>`; }
    const ag = aggregeer(bouwdelenOnder(a.id));
    return `<tr style="border-top:1px solid var(--line);background:#fafbfa"><td style="padding:5px 6px;padding-left:${6+d*16}px"><b>${esc(a.naam)}</b> <span class="small muted">${esc(lvName(a))}</span></td><td>${cbadge(ag.cond)}</td><td>${(x=>x.cond?cbadge(x.cond):'')(aggregeerScore(bouwdelenOnder(a.id),'verz'))}</td><td class="small">${ag.uitkomst?ag.uitkomst.toFixed(3).replace('.',','):''}</td><td class="small">${ag.vw?'€ '+ag.vw.toLocaleString('nl-NL'):''}</td>
      <td class="small muted">${ag.n} van ${ag.totaal} bouwdelen meegeteld${ag.zonderCond?` · ${ag.zonderCond} zonder conditie`:''}${ag.zonderVw?` · <span style="color:#b5651d">${ag.zonderVw} zonder vervangingswaarde</span>`:''}</td></tr>`; }).join('');
  const cl = items('clusters').map(c=>{ const ag = aggregeer([...new Set((c.objecten||[]).flatMap(bouwdelenOnder))]); return `<div class="card"><h3>${esc(c.naam)}</h3><div style="display:flex;gap:8px;align-items:center">${cbadge(ag.cond)}<span class="small muted">${ag.uitkomst?'uitkomst '+ag.uitkomst.toFixed(3).replace('.',',')+' · ':''}${ag.n} van ${ag.totaal} bouwdelen</span></div></div>`; }).join('');
  return `<div class="note small">Aggregatie (§5.5, Bijlage B): per bouwdeel geldt de laatste inspectie. Omhoog wordt gewogen naar <b>vervangingswaarde</b> × correctiefactor (bij een met Bijlage B berekend bouwdeel de uitkomst zelf, anders tabel B.1), gedeeld door de totale vervangingswaarde en herleid met tabel B.2. Bouwdelen zonder vervangingswaarde of conditie tellen niet mee.</div>
    <div class="panel">${distBar}</div>
    ${cl?`<h3 style="margin-top:16px">Per cluster (NEN 8026)</h3><div class="cards">${cl}</div>`:''}
    <div class="panel" style="margin-top:14px;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr class="small muted" style="text-align:left"><th style="padding:6px">Niveau</th><th>Conditie</th><th>Verzorging</th><th>Factor / uitkomst</th><th>Vervangingswaarde</th><th>Toelichting</th></tr>${tree||'<tr><td class="muted">Nog geen objecten.</td></tr>'}</table></div>`;
}

/* ---------- Tab: verouderingskromme (figuur 2, interactief) ---------- */
function krommeInner(){
  const k = (ui.kr ||= {L:40, t:20, C:3, bd:''}); const L = Math.max(1, num(k.L)||40); const t = Math.min(L, Math.max(0, +k.t||0));
  const bd = state.data.assets.find(a=>a.id===k.bd); const gemeten = bd ? bdConditie(bd)?.res.cond : null;
  const W = 660, H = 360, x0 = 60, x1 = 620, y0 = 24, y1 = 300; const X = f => x0 + f*(x1-x0); const Y = C => y0 + (Math.min(6,C)-1)/5*(y1-y0);
  let g = '';
  [[0.5,0.75,'#7cb34222'],[0.75,0.875,'#f1c40f22'],[0.875,1,'#e67e2222']].forEach(([a,b,c])=>{ g += `<rect x="${X(a)}" y="${y0}" width="${X(b)-X(a)}" height="${y1-y0}" fill="${c}"/>`; });
  for(let c=1;c<=6;c++){ g += `<line x1="${x0}" y1="${Y(c)}" x2="${x1}" y2="${Y(c)}" stroke="#e3e7e5"/><text x="${x0-10}" y="${Y(c)+4}" text-anchor="end" font-size="12" fill="#3b4642">${c}</text>`; }
  [[0.5,'½ L'],[0.75,'¾ L'],[0.875,'⅞ L'],[1,'L']].forEach(([f,l])=>{ g += `<line x1="${X(f)}" y1="${y0}" x2="${X(f)}" y2="${y1}" stroke="#cfd6d2" stroke-dasharray="3 3"/><text x="${X(f)}" y="${y1+18}" text-anchor="middle" font-size="11.5" fill="#3b4642">${l} = ${Math.round(f*L*10)/10} jr</text>`; });
  let d = ''; for(let f=0; f<=0.969; f+=0.004){ d += (d?'L':'M')+X(f).toFixed(1)+' '+Y(krommeC(f)).toFixed(1); }
  g += `<path d="${d}" fill="none" stroke="#1d2321" stroke-width="2.4"/><path d="M${X(0.969)} ${Y(6)} L${X(1)} ${y1+2}" stroke="#1d2321" stroke-dasharray="2 3"/>`;
  g += `<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="#1d2321"/><line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#1d2321"/>`;
  g += `<text x="${(x0+x1)/2}" y="${H-4}" text-anchor="middle" font-size="12" fill="#5f6b66">verstreken levensduur t (jaar)</text><text x="16" y="${(y0+y1)/2}" font-size="12" fill="#5f6b66" transform="rotate(-90 16 ${(y0+y1)/2})" text-anchor="middle">conditiescore C</text>`;
  [[0.625,'verval → 2'],[0.8125,'→ 3'],[0.9375,'→ 4']].forEach(([f,l])=>{ g += `<text x="${X(f)}" y="${y0+14}" text-anchor="middle" font-size="10.5" fill="#5f6b66">${l}</text>`; });
  const Ct = krommeC(t/L);
  g += `<line x1="${X(t/L)}" y1="${y0}" x2="${X(t/L)}" y2="${y1}" stroke="#2d5f9a" stroke-width="1.5"/><circle cx="${X(t/L)}" cy="${Y(Ct)}" r="7" fill="#2d5f9a"/>`;
  const lab = `t = ${t} jr → C = ${isFinite(Ct)&&Ct<6?Ct.toFixed(2).replace('.',','):'6'}`; const rechts = t/L < 0.6;
  g += `<text x="${X(t/L)+(rechts?12:-12)}" y="${Math.max(y0+28, Math.min(y1-6,Y(Ct))-12)}" text-anchor="${rechts?'start':'end'}" font-size="12.5" font-weight="700" fill="#2d5f9a">${lab}</text>`;
  const Cm = gemeten || +k.C; const tm = krommeT(Cm, L);
  g += `<circle cx="${X(Math.min(1,tm/L))}" cy="${Y(Cm)}" r="8" fill="#fff" stroke="#c0392b" stroke-width="3"/><text x="${X(Math.min(1,tm/L))-10}" y="${Y(Cm)+20}" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b">${gemeten?'gemeten':'C'} = ${Cm} ↔ t = ${String(Math.round(tm*10)/10).replace('.',',')} jr</text>`;
  const vervalC = t/L>=0.875?4 : t/L>=0.75?3 : t/L>=0.5?2 : 1;
  let uitleg = `<div><b>Theoretische conditie bij ${t} jaar:</b> ${isFinite(Ct)&&Ct<6?Ct.toFixed(2).replace('.',','):'6 (einde levensduur)'} · formule (1). Vangnet "verval" volgens Bijlage F: conditie <b>${Math.min(vervalC, +T27().vervalMax||4)}</b>${vervalC>(+T27().vervalMax||4)?` (begrensd tot ${T27().vervalMax} door instelling)`:''}.</div>
    <div style="margin-top:6px"><b>Conditie ${Cm}</b> hoort theoretisch bij een leeftijd van <b>${String(Math.round(tm*10)/10).replace('.',',')} jaar</b> · theoretische restlevensduur <b>${String(Math.round((L-tm)*10)/10).replace('.',',')} jaar</b> · formule (2).</div>`;
  if(bd && gemeten){ const age = t; const diff = Math.round((tm-age)*10)/10;
    uitleg += `<div class="${Math.abs(diff)<1?'note':'warn'}" style="margin-top:8px;margin-bottom:0">${esc(bd.naam)}: werkelijke leeftijd ${age} jaar, gemeten conditie ${gemeten}. ${Math.abs(diff)<1?'De veroudering verloopt zoals de kromme verwacht.':diff>0?`Het bouwdeel is <b>${String(diff).replace('.',',')} jaar sneller verouderd</b> dan de standaardkromme verwacht.`:`Het bouwdeel is <b>${String(-diff).replace('.',',')} jaar langzamer verouderd</b> dan de standaardkromme verwacht.`} De restlevensduur volgt uit de huidige conditie (§5.4 opm. 2).</div>`; }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${g}</svg><div class="small" style="margin-top:6px">${uitleg}</div>`;
}

/* ---------- Verificatie van instandhoudingseisen met gemeten condities ---------- */
function eisVerificatie2767(it){
  const txt = (it.maatstaf||'')+' '+(it.eis||'');
  if(/beeldkwal|crow/i.test(txt) && crowRank(it.niveau)){ const c = items('clusters').find(x=>x.id===it.cluster); if(!c) return null;
    const bds = [...new Set((c.objecten||[]).flatMap(bouwdelenOnder))]; const met = bds.map(b=>[b, extraWaarde(b,'crowbk')]).filter(([,x])=>x&&crowRank(x.v));
    if(!met.length) return {geen:true, soort:'CROW-beeldkwaliteit'}; const slecht = met.filter(([,x])=>crowRank(x.v)<crowRank(it.niveau)).map(([b,x])=>[b,{res:{cond:x.v}}]);
    return {max:'minimaal '+it.niveau, ok:!slecht.length, slecht, n:met.length, totaal:bds.length, ag:{}, soort:'CROW-beeldkwaliteit'}; }
  if(/verzorg/i.test(txt) && isNum(parseInt(it.niveau))){ const c = items('clusters').find(x=>x.id===it.cluster); if(!c) return null;
    const max = parseInt(it.niveau); const bds = [...new Set((c.objecten||[]).flatMap(bouwdelenOnder))]; const met = bds.map(b=>[b, extraWaarde(b,'verz')]).filter(([,x])=>x);
    if(!met.length) return {geen:true, soort:'verzorgingsscore'}; const slecht = met.filter(([,x])=>+x.v>max).map(([b,x])=>[b,{res:{cond:x.v}}]);
    return {max:'≤ '+max, ok:!slecht.length, slecht, n:met.length, totaal:bds.length, ag:aggregeerScore(bds,'verz'), soort:'verzorgingsscore'}; }
  if(!/2767|conditie/i.test(txt) || !isNum(parseInt(it.niveau))) return null;
  const c = items('clusters').find(x=>x.id===it.cluster); if(!c || !tabellenCompleet()) return null;
  const max = parseInt(it.niveau); const bds = [...new Set((c.objecten||[]).flatMap(bouwdelenOnder))];
  const metC = bds.map(b=>[b, bdConditie(b)]).filter(([,x])=>x);
  if(!metC.length) return {geen:true, max};
  const slecht = metC.filter(([,x])=>x.res.cond>max); const ag = aggregeer(bds);
  return {max:'≤ '+max, ok:!slecht.length, slecht, n:metC.length, totaal:bds.length, ag, soort:'conditiescore'};
}

const CROW = ['A+','A','B','C','D']; const crowRank = l => ({'A+':5,'A':4,'B':3,'C':2,'D':1})[String(l||'').trim().toUpperCase()]||0;
const crowKleur = l => ({'A+':'#2e7d32','A':'#7cb342','B':'#f1c40f','C':'#e67e22','D':'#c0392b'})[l]||'#ccd3cf';
const inspAanv = i => i ? (i.aanvullend || (i.verzorging==='Ja'?['Verzorgingsscore']:[])) : [];
function verzScore(bd, op){
  const v = op?.extra?.verz; if(!v) return null;
  if(v.mode==='gebreken'){ if(!(v.gebreken||[]).length) return {cond:1, res:null}; const r = berekenBouwdeel({vw:bd.vervangingswaarde, gebreken:v.gebreken}); return r.error?null:{cond:r.cond, res:r}; }
  return isNum(v.score) ? {cond:+v.score, res:null} : null;
}
function extraWaarde(bd, key){
  const insps = items('inspecties').slice().sort((a,b)=>(b.datum||'').localeCompare(a.datum||''));
  for(const i of insps){ const op = opnames()[i.id]?.[bd.id]; if(!op?.extra) continue;
    if(key==='verz'){ const s = verzScore(bd, op); if(s) return {v:s.cond, insp:i}; }
    else { const x = op.extra[key]; if(x!==undefined && x!=='' && x!==null && !(typeof x==='object' && !x.status)) return {v:x, insp:i}; } }
  return null;
}
function aggregeerScore(bds, key){
  let som = 0, vw = 0, n = 0;
  for(const bd of bds){ const w = extraWaarde(bd, key); const v = num(bd.vervangingswaarde); if(!w || !v || !isNum(w.v)) continue; som += v*factorB1(+w.v); vw += v; n++; }
  return vw && tabellenCompleet() ? {cond:condB2(som/vw), n} : {n};
}

function GV(){ const G = (state.data.gevolg ||= {methode:'kompas', matrix:{}});
  if(!G.aspecten) G.aspecten = ASP_STD.map(([naam,letter,wa,oms])=>({id:uid(), naam, letter, wa, oms}));
  return G; }
const PKLASSE = [['','Geen','#ccd3cf'],['1','Zeer hoog','#c0392b'],['2','Hoog','#e67e22'],['3','Middel','#f1c40f'],['4','Laag','#7cb342']];
const klasseVan = s => s>=7?1 : s>=5?2 : s>=3?3 : s>=1?4 : 0;

function objectVan(a){ let x = a; while(x && x.niveau>2) x = state.data.assets.find(y=>y.id===x.parent); return x; }

const VERTRAGING = {1:0, 2:1, 3:2, 4:4, 0:5};   // voorstel: jaren uitstel per prioriteitsklasse
function condNaOnderhoud(bd, op, insp){

function laatsteOpname(bd){ const c = bdConditie(bd); if(!c) return null; return {c, op:opnames()[c.insp.id]?.[bd.id], insp:c.insp}; }

  const ns = items('eisen').filter(e=>e.cluster===c.id && /2767|conditie/i.test((e.maatstaf||'')+' '+(e.eis||'')) && !/verzorg/i.test((e.maatstaf||'')+(e.eis||'')) && isNum(parseInt(e.niveau))).map(e=>parseInt(e.niveau));
  return ns.length ? Math.min(...ns) : null; }
function planBouwdeel(bd, start, eind){
  const acts = []; const L = num(bd.levensduur), vw = num(bd.vervangingswaarde); const lo = laatsteOpname(bd);
  // stap 4: herstelmaatregelen uit de inspectie
  if(lo?.op) for(const g of (lo.op.gebreken||[])){ const h = g.herstel; if(!h || !h.uitv) continue; const p = prioriteit(g, bd);
    let j = isNum(h.jaar) ? +h.jaar : start + (VERTRAGING[p.klasse]??2); const achter = j < start; j = Math.max(j, start);
    acts.push({jaar:j, soort:'herstel', oms:h.oms||('Herstel: '+(g.oms||'gebrek')), kosten:num(h.kosten), bron:`${bd.id}|h|${g.id}`, extra:`prioriteit ${PKLASSE[p.klasse][1].toLowerCase()}`+(achter?' · achterstallig':'')}); }
  // stap 6/7: vervanging op basis van levensduur, bijgesteld met gemeten conditie
  let vj = null, basis = '';
  if(L){ if(lo && bd.mjStap7!=='nee'){ const C = lo.c.res.cond; const rest = L - krommeT(C, L); const ij = lo.insp.datum ? +lo.insp.datum.slice(0,4) : start;
      vj = Math.round(ij + rest); basis = `gemeten conditie ${C} → theoretische restlevensduur ${Math.round(rest)} jr (bouwjaar + levensduur: ${num(bd.bouwjaar)?num(bd.bouwjaar)+L:'onbekend'})`; }
    else if(num(bd.bouwjaar)){ vj = num(bd.bouwjaar) + L; basis = `bouwjaar ${bd.bouwjaar} + levensduur ${L} jr`; } }
  if(vj){ const achter = vj < start; let j = Math.max(vj, start);
    while(j<=eind){ acts.push({jaar:j, soort:'vervanging', oms:'Vervanging '+(bd.naam||'bouwdeel'), kosten:vw, bron:`${bd.id}|v|${j}`, extra:basis+(achter&&j===start?' · achterstallig':'')}); j += L||999; } }
  // stap 6: cyclisch onderhoud met kostenkengetallen
  for(const c of (bd.cycli||[])){ const I = num(c.interval); if(!I) continue; let j = isNum(c.start) ? +c.start : start;
    while(j<start) j += I; for(; j<=eind; j+=I) acts.push({jaar:j, soort:'cyclisch', oms:c.oms||'Cyclisch onderhoud', kosten:num(c.kosten), bron:`${bd.id}|c|${c.id}|${j}`, extra:`elke ${I} jaar`}); }

}
const SOORTKLEUR = {herstel:'#c0392b', vervanging:'#2d5f9a', cyclisch:'#1f6f5c'};
function mjopGrafiek(acts, start, eind){

  const per = Object.fromEntries(ys.map(y=>[y,{herstel:0,vervanging:0,cyclisch:0}])); acts.forEach(a=>{ if(per[a.jaar]) per[a.jaar][a.soort] += a.kosten||0; });
  const tot = ys.map(y=>Object.values(per[y]).reduce((s,v)=>s+v,0)); const max = Math.max(1,...tot); const gem = tot.reduce((s,v)=>s+v,0)/ys.length;
  const W = 680, H = 240, x0 = 64, bw = (W-x0-10)/ys.length, Y = v => H-28 - v/max*(H-50);

  [0,0.5,1].forEach(f=>{ const v = max*f; g += `<line x1="${x0}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef1ef"/><text x="${x0-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#5f6b66">€ ${Math.round(v/1000).toLocaleString('nl-NL')}k</text>`; });
  ys.forEach((y,i)=>{ let base = 0; const x = x0+i*bw+3;
    for(const s of ['vervanging','herstel','cyclisch']){ const v = per[y][s]; if(!v) continue; g += `<rect x="${x}" y="${Y(base+v)}" width="${bw-6}" height="${Y(base)-Y(base+v)}" fill="${SOORTKLEUR[s]}"><title>${y} · ${s}: € ${v.toLocaleString('nl-NL')}</title></rect>`; base += v; }
    if(tot[i]>1.5*gem && tot[i]>0) g += `<text x="${x+(bw-6)/2}" y="${Y(tot[i])-5}" text-anchor="middle" font-size="11" fill="#b5651d">▲</text>`;
    g += `<text x="${x+(bw-6)/2}" y="${H-10}" text-anchor="middle" font-size="10" fill="#5f6b66">${y}</text>`; });
  if(gem) g += `<line x1="${x0}" x2="${W}" y1="${Y(gem)}" y2="${Y(gem)}" stroke="#1d2321" stroke-dasharray="4 3"/><text x="${x0+4}" y="${Y(gem)-4}" font-size="10" fill="#1d2321">gemiddeld € ${Math.round(gem).toLocaleString('nl-NL')}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${g}</svg>

}

function mjopOvernemen(){
  const scope = state.data.assets.find(a=>a.id===ui.mjs); const bds = bouwdelenOnder(scope.id);
  const start = +(ui.mjstart || new Date().getFullYear()); const eind = start + +(ui.mjhor||10) - 1; let n = 0;
  for(const b of bds) for(const a of planBouwdeel(b, start, eind).acts){
    if(items('maatregelen').some(m=>m.bron===a.bron)) continue;
    items('maatregelen').push({id:uid(), _t:Date.now(), bron:a.bron, titel:a.oms, cluster:clusterVan(b)?.id||'', assets:[b.id], soort:a.soort==='herstel'?'Correctief onderhoud':a.soort==='vervanging'?'Vervanging':'Preventief onderhoud', plan:'Meerjarenplan', jaar:String(a.jaar), kosten:String(a.kosten||''), status:'Gepland', toelichting:`Uit MJOP (Bijlage E) · ${a.extra||''}`}); n++; }
  save(); return n;
}

function preventieveSignalen(){

  items('kpis').forEach(k=>{ const v = kpiReeks(k).map(x=>x[1]); if(v.length>=2){ const slechter = k.richting==='Lager is beter' ? v.at(-1)>v.at(-2) : v.at(-1)<v.at(-2); if(slechter) out.push(['Indicator verslechtert', k.naam, 'kpi:'+k.id]); } });

    if(num(b.bouwjaar)&&num(b.levensduur)&&num(b.bouwjaar)+num(b.levensduur)<=ja) out.push(['Theoretische levensduur verstreken', b.naam, 'bd:'+b.id]);
    if(tabellenCompleet()){ const c = bdConditie(b), m = eisMaxVoor(b); if(c && m && c.res.cond===m) out.push(['Conditie op de grens van de eis (nog net voldoende)', `${b.naam} (conditie ${c.res.cond}, eis ≤ ${m})`, 'bd:'+b.id]); } });
  items('observaties').filter(o=>o.voldoet==='Nee').forEach(o=>out.push(['Observatie voldoet niet aan eis', o.titel||o.soort, 'obs:'+o.id]));
  items('meldingen').filter(m=>!items('incidenten').some(i=>i.melding===m.id)).forEach(m=>out.push(['Melding van serviceprovider', m.titel, 'mel:'+m.id]));

    {a:'6.2.2', t:'Planning voor het bereiken van de AM-doelstellingen',

const ISTAT = [['','— niet beoordeeld —','#ccd3cf',null],['ja','Voldoet','#2e7d32',2],['deels','Deels','#e6a23c',1],['nee','Voldoet niet','#c0392b',0],['nvt','N.v.t.','#9aa5a0',null]];
const isoKey = (a,k) => `2014|${a}|${k}`;
function artScore(art){ if(art.todo) return null; const vals = art.e.map(([k])=>ISTAT.find(s=>s[0]===(ISO().eval[isoKey(art.a,k)]?.st||''))[3]).filter(v=>v!==null);
  const beoord = art.e.filter(([k])=>ISO().eval[isoKey(art.a,k)]?.st).length;
  return {pct: vals.length ? vals.reduce((s,v)=>s+v,0)/(vals.length*2) : null, beoord, tot:art.e.length}; }
const isoArts = () => ISO_HFST.flatMap(h=>h.art.filter(a=>!a.todo));
function isoLink(l){ if(!l) return ''; const [h,t] = l; return `<button class="small" data-isogo="${h}|${t||''}" style="font-size:11px;padding:1px 7px">bekijk →</button>`; }

function tIsoOverzicht(){
  const arts = isoArts(); const sc = arts.map(artScore);
  const alle = arts.flatMap(a=>a.e.map(([k])=>ISO().eval[isoKey(a.a,k)]?.st||''));
  const tel = s => alle.filter(x=>x===s).length;
  const HK = {'4':'4 Context','5':'5 Leiderschap','6':'6 Planning','7':'7 Ondersteuning','8':'8 Uitvoering','9':'9 Evaluatie','10':'10 Verbetering'};
  const hs = ISO_HFST.filter(h=>h.art.some(a=>!a.todo)); const axes = hs.map(h=>HK[h.h]);
  const vals = hs.map(h=>{ const ps = h.art.filter(a=>!a.todo).map(artScore).map(x=>x.pct).filter(x=>x!==null); return ps.length ? ps.reduce((a,b)=>a+b,0)/ps.length*3 : 0; });
  const ev0 = arts.flatMap(a=>a.e.map(e=>e[2]())); const evOk = ev0.filter(x=>x.ok).length;
  return `<div class="note small">ISO 55000 geeft overzicht, principes en begrippen; <b>ISO 55001</b> bevat de eisen aan het assetmanagementsysteem; <b>ISO 55002</b> geeft toelichting. In deze tool: per eis een <b>eigen samenvatting</b> met artikelnummer, de toelichting uit 55002 in eigen woorden, het <b>bewijs dat al in de tool ligt</b> (NEN 8026, NEN 2767) en jouw zelfevaluatie. Versie: NEN-ISO 55001:2014 en 55002:2014 — de 2014-edities zijn inmiddels vervangen door ISO 55001:2024; eisen dragen een versielabel zodat 2024 later kan worden toegevoegd.</div>
    <div style="display:grid;grid-template-columns:minmax(320px,1fr) minmax(280px,1fr);gap:16px;align-items:start">
      <div class="panel" style="text-align:center"><h3 style="text-align:left">Volwassenheid per hoofdstuk</h3>${radar(axes, [{vals, color:'#1f6f5c', fill:'rgba(31,111,92,.15)'}], 360)}
        <p class="small muted" style="margin:0">0 = niets voldoet · 3 = alles voldoet (voldoet = 1, deels = ½, n.v.t. telt niet mee)</p></div>
      <div class="panel"><h3>Stand van de zelfevaluatie</h3>

  if(r){

    if(d.b1){ ui.b1 = d.b1; rerender(); return; }
    if(d.b1art){ ui.itab = 'eisen'; ui.isoopen = d.b1art; ui.isof = ''; window.scrollTo(0,0); route(); return; }
    if(d.i10){ ui.i10 = d.i10; rerender(); return; }
    if(d.prevactie){ const a = {id:uid(), _t:Date.now(), titel:'Preventief: '+d.prevtxt.slice(0,80), bron:'Preventief signaal', soortAc:'Preventief', signaal:d.prevactie, status:'Open'}; items('acties').push(a); save(); rerender(); return; }
    if(d.mkinc){ const m = items('meldingen').find(x=>x.id===d.mkinc); const i = {id:uid(), _t:Date.now(), titel:m.titel, soortI:'Functionele storing asset', datum:m.datum||'', assets:m.assets||[], melding:m.id, reactie:m.opvolging||''}; items('incidenten').push(i); ui.sel.incidenten = i.id; ui.i10='incidenten'; save(); rerender(); return; }

    if(d.i8){ ui.i8 = d.i8; rerender(); return; }
    if(d.wijzvan){ const tr = state.data.assets.filter(a=>(a.fase==='op'||a.fase==='af') && !items('wijzigingen').some(w=>(w.assets||[]).includes(a.id)));
