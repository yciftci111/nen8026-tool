<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waardegestuurd in stand houden – NEN 8026 tool</title>
<style>
  :root{
    --bg:#f5f6f4; --panel:#ffffff; --ink:#1d2321; --muted:#5f6b66; --line:#dde2df;
    --accent:#1f6f5c; --accent-soft:#e3f0ec; --scope:#6aa84f;
    --l1:#7a4b8c; --l2:#2d5f9a; --l3:#1f6f5c; --l4:#b5651d;
    --l1s:#f3ecf6; --l2s:#e8eff8; --l3s:#e3f0ec; --l4s:#f9eee3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:13px}
  header .spacer{flex:1}
  .ctl{display:flex;flex-direction:column;gap:2px}
  .ctl label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  select,button,input,textarea{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  button{cursor:pointer}
  button:hover{border-color:#b9c3be}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.danger{color:#a3322a}
  button.danger.armed{background:#a3322a;color:#fff;border-color:#a3322a}
  .layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}
  nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 0}
  nav .group{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 20px 6px}
  nav a{display:flex;align-items:center;gap:10px;padding:7px 20px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent}
  nav a:hover{background:var(--bg)}
  nav a.active{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
  nav a.dim{opacity:.38}
  nav .dot{width:9px;height:9px;border-radius:50%;flex:none}
  main{padding:26px 34px;max-width:1150px}
  main h2{margin:0 0 4px;font-size:24px}
  h3{font-size:16px;margin:0 0 6px}
  .ref{color:var(--muted);font-size:13px;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card p{margin:0;color:var(--muted);font-size:13px}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#eee;color:var(--muted)}
  .badge.todo{background:#fff3e0;color:#9a5b00}
  .badge.ok{background:var(--accent-soft);color:var(--accent)}
  .note{background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:14px}
  .warn{background:#fff6e5;border:1px solid #f0d9a8;border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 18px;flex-wrap:wrap}
  .tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted)}
  .tabs button.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .info{margin-top:14px;min-height:60px}
  .info .panel{border-left:4px solid var(--accent)}
  .muted{color:var(--muted)}
  .small{font-size:13px}

  /* ---------- Methodekaart (eigen weergave van de stappen) ---------- */
  .map{display:grid;grid-template-columns:38px 1fr 38px;gap:8px}
  .side{border-radius:8px;background:#eef1ef;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);
        display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;cursor:pointer}
  .side.right{transform:none}
  .side:hover{background:#e2e8e5;color:var(--ink)}
  .bands{display:flex;flex-direction:column;gap:6px;position:relative}
  .band{border-radius:10px;padding:10px 12px 12px;position:relative}
  .band .bh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:8px}
  .band .bh span:last-child{font-weight:500;color:var(--muted)}
  .b1{background:var(--l1s)} .b2{background:var(--l2s)} .b3{background:var(--l3s)} .b4{background:var(--l4s)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .col{display:flex;flex-direction:column;gap:6px}
  .colh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:600}
  .step{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;text-align:left;width:100%;display:flex;justify-content:space-between;gap:6px;align-items:center}
  .step:hover{border-color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .step.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .step.out{border-style:dashed;color:var(--muted)}
  .step.dim{opacity:.35}
  .step .r{font-size:11px;color:var(--muted);white-space:nowrap}
  .step.phase{background:var(--l2);color:#fff;border-color:var(--l2);font-weight:600;justify-content:center}
  .step.phase .r{color:#dfe8f3}
  .scopebox{border:2px solid var(--scope);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;position:relative}
  .scopetag{position:absolute;top:-11px;right:14px;background:var(--scope);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:18px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

  /* ---------- Levensfasen ---------- */
  .phases{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ph{flex:1;min-width:120px;padding:14px 8px;text-align:center;border-radius:8px;border:2px solid var(--l2);font-weight:600;font-size:13px;cursor:pointer;background:#fff;color:var(--l2)}
  .ph.in{background:var(--l2);color:#fff}
  .ph.sel{outline:3px solid var(--scope);outline-offset:2px}
  .arrow{color:var(--muted)}

  /* ---------- Rollenpiramide ---------- */
  .pyr{display:grid;grid-template-columns:130px 1fr 1fr 150px;gap:8px;align-items:stretch}
  .pyr .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .tier{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;min-height:56px;cursor:pointer;text-align:center;padding:4px 6px}
  .lvl{border-radius:8px;display:flex;align-items:center;padding:8px 10px;font-size:13px;font-weight:600}
  .tasks{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  .prod{border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;text-align:center}
  .pyr .rowsel .tasks{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

  /* ---------- Begrippen ---------- */
  .gl-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .gl-tools input{flex:1;min-width:220px}
  .gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .term{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .term b{font-size:14px}
  .term .tag{float:right;font-size:11px;color:var(--muted)}
  .term p{margin:6px 0 0;font-size:13px}
  .chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ---------- Assetstructuur ---------- */
  .tree-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
  .tree{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:300px}
  .node{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:14px}
  .node:hover{background:var(--bg)}
  .node.sel{background:var(--accent-soft)}
  .node .lv{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
  .fase{font-size:11px;padding:1px 7px;border-radius:99px;margin-left:auto;white-space:nowrap}
  .f-gebruik{background:#e8eff8;color:#2d5f9a}
  .f-op{background:#e7f4e1;color:#3d7a26}
  .f-af{background:#fdeee0;color:#9a5b00}
  .f-weg{background:#eee;color:#777}
  .form{display:grid;gap:10px}
  .form label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
  .form input,.form select,.form textarea{width:100%}
  .krit{display:flex;gap:4px}
  .krit button{flex:1;padding:6px 0}
  .krit button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pick{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fafbfa}
  .pick label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);margin:0;cursor:pointer}
  .pick input{width:auto;margin:0}
  #samp h3{margin-top:16px} #samp ul{margin:4px 0;padding-left:20px;font-size:14px}
  @media print{
    header,nav,.tabs,footer,.noprint,main>h2,main>.ref{display:none!important}
    .layout{display:block} main{padding:0;max-width:none} body{background:#fff}
    #samp{border:none;padding:0}
  }
  footer{color:var(--muted);font-size:12px;padding:30px 0 10px}

  @media (max-width:860px){
    .layout{grid-template-columns:1fr} nav{border-right:none;border-bottom:1px solid var(--line)}
    main{padding:18px} .tree-wrap{grid-template-columns:1fr} .pyr{grid-template-columns:90px 1fr} .pyr .tasks,.pyr .prod,.pyr .h:nth-child(n+3){display:none}
    .row{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Waardegestuurd in stand houden</h1>
    <div class="sub">Tool op basis van de methode uit NEN 8026 · v0.4</div>
  </div>
  <div class="spacer"></div>
  <div class="ctl"><label for="rol">Ik werk als</label><select id="rol"></select></div>
  <div class="ctl"><label for="sector">Sector</label><select id="sector"></select></div>
  <div class="ctl"><label>&nbsp;</label><div style="display:flex;gap:6px">
    <button id="btnExport">Exporteren</button><button id="btnImport">Importeren</button></div></div>
  <input type="file" id="fileImport" accept=".json" hidden>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
/* ==================================================================
   NB: Deze tool bevat GEEN tekst of figuren uit NEN 8026.
   Omschrijvingen zijn eigen samenvattingen; figuren zijn eigen
   weergaven. Raadpleeg altijd de norm zelf (verwijzingen per §).
   ================================================================== */

/* ---------------- Rollen ---------------- */
const ROLLEN = {
  alle:{naam:'Alle rollen'},
  AO:{naam:'Asset owner (AO)', niveaus:['bestuurlijk']},
  GAO:{naam:'Gemandateerd asset owner', niveaus:['strategisch']},
  AM:{naam:'Assetmanager (AM)', niveaus:['strategisch','tactisch']},
  SP:{naam:'Serviceprovider (SP)', niveaus:['operationeel']},
};

/* ---------------- Modules (menu) ---------------- */
const MODULES = [
  { id:'start', group:'Basis', title:'Methodekaart', color:'var(--accent)' },
  { id:'basis', group:'Basis', title:'Begrippen & methode', ref:'H3 en H4', color:'var(--accent)' },
  { id:'bestuurlijk', group:'Niveaus', title:'Bestuurlijk niveau', ref:'H5', color:'var(--l1)', product:'Kaders',
    parts:[['Belangen stakeholders','§5.3.1'],['Organisatiedoelstellingen','§5.3.2'],['Randvoorwaarden','§5.3.3'],
      ['Perspectief en besluit','§5.3.4'],['Dilemma\'s','§5.3.5'],['Tijdige communicatie','§5.3.6'],['Assessment','§5.4'],['Informatiebehoefte','§5.5']]},
  { id:'strategisch', group:'Niveaus', title:'Strategisch niveau', ref:'H6', color:'var(--l2)', product:'SAMP',
    parts:[['Waardeaspecten bijeenbrengen','§4.8 fig. 5 / H6'],['Assetmanagementdoelstellingen','§6.3.1'],['Levensfasen vaststellen','§6.3.2'],
      ['Consequenties inzichtelijk','§6.3.3'],['Dilemma\'s','§6.3.4'],['Vastlegging','§6.3.5'],['Assessment','§6.4'],['Informatiebehoefte','§6.5']]},
  { id:'tactisch', group:'Niveaus', title:'Tactisch niveau', ref:'H7', color:'var(--l3)', product:'AMP',
    parts:[['Waardekompassen opstellen','§7.3.1'],['Waardekompassen bijstellen','§7.3.2'],['Instandhoudingseisen','§7.3.3'],['Risicoanalyse','§7.3.4'],
      ['Instandhoudingsconcepten opstellen','§7.3.5'],['Instandhoudingsconcepten bijstellen','§7.3.6'],['Uitvoeringseisen','§7.3.7'],
      ['Plannen en begrotingen','§7.3.8'],['Advies aan asset owner','§7.3.9'],['Dilemma\'s','§7.3.10'],['Vastlegging','§7.3.11'],['Assessment','§7.4'],['Informatiebehoefte','§7.5']]},
  { id:'operationeel', group:'Niveaus', title:'Operationeel niveau', ref:'H8', color:'var(--l4)', product:'Uitvoeringsplannen',
    parts:[['Werkzaamheden instandhouding','§8.2.1'],['Observaties','§8.2.2'],['Assetportfolio inventariseren','§8.2.3'],
      ['Vastlegging','§8.2.4'],['Assessment','§8.3'],['Informatiebehoefte','§8.4']]},
  { id:'assets', group:'Inrichting', title:'Assetstructuur', ref:'§3.10–3.14, §4.4', color:'var(--muted)' },
  { id:'waardeaspecten', group:'Inrichting', title:'Waardeaspectentabel', ref:'§6.3.1, Bijlage A', color:'var(--muted)' },
  { id:'rollen', group:'Inrichting', title:'Rolverdeling', ref:'§4.7', color:'var(--muted)' },
];

/* ---------------- Sectoren (doelgroepen uit §4.2) ---------------- */
const SECTOREN = [
  {id:'leeg', naam:'Algemeen / zelf inrichten', niveaus:['Assetportfolio','Assetsysteem','Beheerobject','Onderdeel'], vb:'bijv. portfolio → systeem → object → onderdeel'},
  {id:'overheid', naam:'Rijk, provincie of gemeente', niveaus:['Assetportfolio','Assetsysteem','Beheerobject','Onderdeel'], vb:'bijv. Infra → Wegennet → Brug N201 → Lager'},
  {id:'waterschap', naam:'Waterschap of drinkwaterbedrijf', niveaus:['Assetportfolio','Watersysteem','Kunstwerk','Onderdeel'], vb:'bijv. Watersysteem → Polder X → Gemaal Y → Pomp 1'},
  {id:'haven', naam:'Havenbedrijf of luchthaven', niveaus:['Assetportfolio','Assetsysteem','Beheerobject','Onderdeel'], vb:'bijv. Kades → Kade 7 → Bolder'},
  {id:'commercieel', naam:'Commerciële of particuliere eigenaar', niveaus:['Vastgoedportefeuille','Complex','Gebouw','Bouwdeel'], vb:'bijv. Kantoren → Complex A → Gebouw 1 → Installaties'},
  {id:'woning', naam:'Woningcorporatie', niveaus:['Woningbezit','Complex','Woongebouw','Bouwdeel'], vb:'bijv. Bezit → Complex 120 → Flat → Dak'},
  {id:'zorg', naam:'Zorginstelling', niveaus:['Zorgvastgoed','Locatie','Gebouw','Bouwdeel'], vb:'bijv. Locatie Noord → Hoofdgebouw → Liften'},
  {id:'onderwijs', naam:'Onderwijsinstelling', niveaus:['Onderwijsvastgoed','Locatie','Gebouw','Bouwdeel'], vb:'bijv. Campus → Gebouw B → Gevel'},
];

/* ---------------- Methodekaart: stappen (eigen weergave van §4.8) ---------------- */
const STAPPEN = {
  b1:{t:'Organisatiedoelen, AM-beleid en portfolio samenstellen', lv:'bestuurlijk', rol:'AO', ref:'§5.3.2', mod:'bestuurlijk', scope:false,
      u:'De asset owner bepaalt waar de organisatie voor staat, geeft richting met assetmanagementbeleid en bepaalt welke assets tot het portfolio horen.'},
  b2:{t:'Portfolioperspectief formuleren', lv:'bestuurlijk', rol:'AO', ref:'§5.3.4', mod:'bestuurlijk', scope:false,
      u:'Een beeld van de gewenste toekomst van het portfolio. Dit voedt (indirect) de keuze voor gebruiksfase.'},
  b3:{t:'Portfoliobesluit nemen', lv:'bestuurlijk', rol:'AO', ref:'§5.3.4', mod:'bestuurlijk', scope:false,
      u:'Een besluit tot wijzigen (op- of afwaarderen, afstoten) brengt assets in de transitiefase.'},
  s1:{t:'Waardeaspecten bijeenbrengen', lv:'strategisch', rol:'AM', ref:'§4.6, H6', mod:'strategisch', scope:true,
      u:'De organisatie stelt haar eigen lijst van waardeaspecten samen. Die is het hulpmiddel om AM-doelstellingen op te stellen.'},
  s2:{t:'Assetmanagementdoelstellingen formuleren', lv:'strategisch', rol:'AM', ref:'§6.3.1', mod:'strategisch', scope:true,
      u:'Organisatiedoelen worden vertaald naar doelen voor de assets, vastgelegd in het SAMP.'},
  s3:{t:'Levensfasen vaststellen', lv:'strategisch', rol:'AM', ref:'§6.3.2', mod:'strategisch', scope:true,
      u:'Per assetsysteem of beheerobject: zit het in de gebruiksfase of in de transitiefase? Dat bepaalt welk spoor hieronder gevolgd wordt.'},
  pg:{t:'Gebruiksfase', lv:'strategisch', phase:true, ref:'§3.21, §4.4', mod:'basis', scope:true,
      u:'De asset is in gebruik en vervult de vereiste functie. Volg het linkerspoor: opstellen.'},
  pt:{t:'Transitiefase', lv:'strategisch', phase:true, ref:'§3.43, §4.4', mod:'basis', scope:true,
      u:'Er is besloten tot een wijziging die nog niet is uitgevoerd. Volg het rechterspoor: aanpassen en bijstellen.'},
  g1:{t:'Waardekompassen opstellen', lv:'tactisch', rol:'AM', ref:'§7.3.1', mod:'tactisch', scope:true,
      u:'Het hart van de methode: welke waardeaspecten spelen bij dit beheerobject of assettype, en hoe zwaar?'},
  g2:{t:'Instandhoudingseisen formuleren', lv:'tactisch', rol:'AM', ref:'§7.3.3', mod:'tactisch', scope:true,
      u:'Prestatie-eisen, eisen aan de fysieke staat en eisen aan esthetica/verzorging. Iteratief met de risicoanalyse.'},
  g3:{t:'Risicoanalyse uitvoeren', lv:'tactisch', rol:'AM', ref:'§7.3.4', mod:'tactisch', scope:true,
      u:'Wat gebeurt er als niet aan de eisen wordt voldaan? Uitkomst kan de eisen weer bijstellen (terugkoppeling).'},
  g4:{t:'Instandhoudingsconcepten opstellen', lv:'tactisch', rol:'AM', ref:'§7.3.5', mod:'tactisch', scope:true,
      u:'Hoe houden we het in stand: onderhoud (SAO/GAO/TAO), observaties, instructies, incident- en calamiteitenmanagement.'},
  g5:{t:'Uitvoeringseisen formuleren', lv:'tactisch', rol:'AM', ref:'§7.3.7', mod:'tactisch', scope:true,
      u:'Eisen aan de uitvoering, als basis voor de opdracht aan de serviceprovider.'},
  g6:{t:'Instandhoudingsplannen en begroting opstellen', lv:'tactisch', rol:'AM', ref:'§7.3.8', mod:'tactisch', scope:false,
      u:'Plannen en begroting volgen uit de eisen en concepten. Valt buiten het kader van de methode zelf.'},
  t1:{t:'Waardekompas aanpassen', lv:'tactisch', rol:'AM', ref:'§7.3.2', mod:'tactisch', scope:true,
      u:'Bij een op- of afwaarderingsbesluit wordt het waardekompas (tijdelijk) bijgesteld.'},
  t2:{t:'Instandhoudingseisen aanpassen', lv:'tactisch', rol:'AM', ref:'§7.3.3', mod:'tactisch', scope:true,
      u:'Eisen kunnen per levensfase verschillen, bijv. lagere eisen aan een gebouw dat wordt afgestoten.'},
  t3:{t:'Risicoanalyse actualiseren', lv:'tactisch', rol:'AM', ref:'§7.3.4', mod:'tactisch', scope:true,
      u:'Risico\'s opnieuw beoordelen in het licht van de komende wijziging.'},
  t4:{t:'Instandhoudingsconcepten bijstellen', lv:'tactisch', rol:'AM', ref:'§7.3.6', mod:'tactisch', scope:true,
      u:'Concept aanpassen aan de transitie, bijv. van TAO naar SAO bij naderende sloop.'},
  t5:{t:'Uitvoeringseisen bijstellen', lv:'tactisch', rol:'AM', ref:'§7.3.7', mod:'tactisch', scope:true,
      u:'Uitvoeringseisen in lijn brengen met de bijgestelde concepten.'},
  t6:{t:'Plannen en begroting bijstellen', lv:'tactisch', rol:'AM', ref:'§7.3.8', mod:'tactisch', scope:false,
      u:'Plannen en begroting aanpassen aan de transitie.'},
  o1:{t:'Uitvoering', lv:'operationeel', rol:'SP', ref:'§8.2', mod:'operationeel', scope:false,
      u:'De serviceprovider voert werkzaamheden en observaties uit en rapporteert terug.'},
  check:{t:'Check: assessment', lv:'alle', ref:'§4.8', mod:'basis', scope:false,
      u:'Op elk niveau: observeren, verifiëren (voldoen we aan wat is afgesproken?) en valideren (doen we de juiste dingen?).'},
  act:{t:'Act: evalueren en bijsturen', lv:'alle', ref:'§4.8', mod:'basis', scope:false,
      u:'Op basis van de assessments wordt op elk niveau bijgestuurd. Zo sluit de PDCA-cirkel.'},

/* ---------------- Begrippen: eigen korte omschrijvingen ---------------- */

}

/* ---------------- Navigatie ---------------- */
function renderNav(active){
  const nv = rolNiveaus();
  let html = '', group = '';
  for(const m of MODULES){
    if(m.group !== group){ group = m.group; html += `<div class="group">${group}</div>`; }
    const dim = nv && m.group==='Niveaus' && !nv.includes(m.id);
    html += `<a href="#${m.id}" class="${m.id===active?'active':''} ${dim?'dim':''}">
      <span class="dot" style="background:${m.color}"></span>${m.title}</a>`;
  }
  nav.innerHTML = html;
}

const FASE_OPT = [['gebruik','Gebruiksfase','f-gebruik'],['op','Transitie – opwaarderen','f-op'],['af','Transitie – afwaarderen','f-af'],['weg','Afgestoten / gesloopt','f-weg']];
const uid = () => Math.random().toString(36).slice(2,9);
function children(pid){ return state.data.assets.filter(a=>a.parent===pid); }
function renderTree(pid, depth){
  return children(pid).map(a=>{
    const f = FASE_OPT.find(x=>x[0]===a.fase)||FASE_OPT[0];
    const lv = sector().niveaus[Math.min(a.niveau,3)];
    return `<div class="node ${ui.node===a.id?'sel':''}" data-node="${a.id}" style="padding-left:${8+depth*20}px">
      <span class="lv">${esc(lv)}</span><span>${esc(a.naam)||'<i class="muted">(naamloos)</i>'}</span>
      ${a.krit?`<span class="small muted">K${a.krit}</span>`:''}${perspectiefVoor(a.id)?`<span class="fase" style="background:#f3ecf6;color:#7a4b8c;margin-left:auto" title="Er is een perspectief aangekondigd (§5.3.4)">◷ perspectief</span>`:''}<span class="fase ${f[2]}" ${perspectiefVoor(a.id)?'style="margin-left:4px"':''}>${f[1].replace('Transitie – ','↗ ').replace('↗ afwaarderen','↘ afwaarderen')}</span></div>`

}

function gecombineerd(persoonId){

  return r.includes('Assetmanager') && (r.includes('Asset owner')||r.includes('Gemandateerd asset owner'));

function assetPicker(sel, name, max){
  const rows = []; const walk=(pid,d)=>children(pid).forEach(a=>{ if(max===undefined||a.niveau<=max){rows.push([a,d]);walk(a.id,d+1);} }); walk(null,0);
  if(!rows.length) return `<p class="small muted" style="margin:0">Nog geen objecten. Voeg ze toe in <a href="#assets">Assetstructuur</a>.</p>`;
  return `<div class="pick">${rows.map(([a,d])=>`<label style="padding-left:${d*16}px"><input type="checkbox" ${name} data-rv="${a.id}" ${(sel||[]).includes(a.id)?'checked':''}> ${esc(a.naam)||'(naamloos)'} <span class="small muted">${esc(sector().niveaus[Math.min(a.niveau,3)])}</span></label>`).join('')}</div>`;
}
function fieldHtml(key, it, f){
  const a = `data-rk="${key}" data-rid="${it.id}" data-rf="${f.k}"`; const v = it[f.k];
  let inp;
  if(f.type==='text') inp = `<input ${a} value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
  else if(f.type==='textarea') inp = `<textarea ${a} rows="3">${esc(v)}</textarea>`;
  else if(f.type==='date') inp = `<input type="date" ${a} value="${esc(v)}">`;
  else if(f.type==='select') inp = `<select ${a} ${it.vast&&f.k==='relevant'?'disabled':''}><option value="">— kies —</option>${f.opts.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(f.type==='checks') inp = `<div class="pick">${f.opts.map(o=>`<label><input type="checkbox" ${a} data-rv="${esc(o)}" ${(v||[]).includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`;
  else if(f.type==='assets') inp = assetPicker(v, a, f.max);
  else if(f.type==='refsel'){ const src = items(f.ref);
    inp = `<select ${a}><option value="">— kies —</option>${src.map(o=>`<option value="${o.id}" ${v===o.id?'selected':''}>${esc(REG[f.ref].label(o)||'(naamloos)')}</option>`).join('')}</select>`
      + (src.length?'':`<div class="small muted">Nog niets ingevoerd bij ${REG[f.ref].t}s.</div>`); }
  else if(f.type==='ref'){ const src = items(f.ref);
    inp = src.length ? `<div class="pick">${src.map(o=>`<label><input type="checkbox" ${a} data-rv="${o.id}" ${(v||[]).includes(o.id)?'checked':''}> ${esc(REG[f.ref].label(o)||'(naamloos)')}</label>`).join('')}</div>`
      : `<p class="small muted" style="margin:0">Nog niets ingevoerd bij ${REG[f.ref].t}s.</p>`; }
  return `<div><label>${f.l}</label>${inp}${f.hint?`<div class="small muted" style="margin-top:3px">${f.hint}</div>`:''}</div>`;
}
function renderRegister(key, extraForm){
  const R = REG[key], list = items(key), it = list.find(x=>x.id===ui.sel[key]);

    <div><div class="tree">${list.map(x=>`<div class="node ${it&&it.id===x.id?'sel':''}" data-rsel="${key}:${x.id}">
        <span class="rl">${esc(R.label(x))||'<i class="muted">(naamloos)</i>'}</span><span class="small muted" style="margin-left:auto;text-align:right">${esc(R.meta(x)||'')}</span></div>`).join('')

  const t = ui.btab;

function besluitExtra(it){
  if(!(it.soort||'').startsWith('Besluit') || !it.richting || !(it.assets||[]).length) return '';

  const klaar = it.assets.every(id=>state.data.assets.find(a=>a.id===id)?.fase===f);
  return `<div class="warn small" style="margin:0">${klaar?'✓ De betrokken objecten staan in de transitiefase ('+it.richting.toLowerCase()+').'
    :`Dit besluit brengt ${it.assets.length} object(en) in de transitiefase. <div style="margin-top:6px"><button class="primary" data-apply="${it.id}">Zet objecten in transitiefase – ${it.richting.toLowerCase()}</button></div>`}</div>`;
}

const BIJLAGE_A = [
  ['Functionaliteit', [
    ['Compliance','Voldoen aan wet- en regelgeving en andere verplichtingen. Altijd opgenomen; vormt de ondergrens.'],
    ['Veiligheid','Geen onaanvaardbaar risico op letsel of schade voor gebruikers, omgeving en personeel (RAMS: Safety).'],
    ['Gezondheid','Geen nadelige invloed op de gezondheid van gebruikers en omgeving, bijv. binnenklimaat of waterkwaliteit.'],
    ['Bruikbaarheid','De asset is geschikt voor het gebruik waarvoor hij bedoeld is.'],
    ['Beschikbaarheid','De asset is beschikbaar op het moment dat hij nodig is (RAMS: Availability).'],
    ['Betrouwbaarheid','De asset functioneert zonder onverwachte storingen (RAMS: Reliability).'],
    ['Onderhoudbaarheid','Onderhoud kan eenvoudig, veilig en met weinig hinder worden uitgevoerd (RAMS: Maintainability).'],
    ['Toegankelijkheid','De asset is fysiek toegankelijk voor de beoogde gebruikers.'],
  ]],
  ['Leefomgeving en maatschappij', [
    ['Esthetica','Uitstraling en beeldkwaliteit van de asset en zijn omgeving.'],
    ['Cultuurhistorisch','Behoud van erfgoed- en cultuurhistorische waarden.'],
    ['Leefbaarheid','Bijdrage aan een prettige, schone en sociaal veilige leefomgeving.'],
    ['Bereikbaarheid','De asset en zijn omgeving blijven goed bereikbaar, ook tijdens werkzaamheden.'],
    ['Duurzaamheid','Instandhouding op de lange termijn met zo min mogelijk belasting van mens en milieu.'],
    ['Circulair','Hergebruik van materialen en grondstoffen; zo min mogelijk afval.'],
    ['Ecologisch','Behoud en versterking van natuur en biodiversiteit.'],
    ['Energieverbruik','Beperken van energieverbruik en CO₂-uitstoot.'],
    ['Klimaatadaptatie','Bestand tegen hitte, droogte, extreme neerslag en wateroverlast.'],
    ['Inclusiviteit','Bruikbaar voor iedereen, ongeacht beperking, leeftijd of achtergrond.'],
  ]],
];
function laadBijlageA(){
  const list = items('waardeaspecten'); let n = 0;
  for(const [thema, rows] of BIJLAGE_A) for(const [naam, oms] of rows){
    if(list.some(w=>(w.naam||'').toLowerCase()===naam.toLowerCase())) continue;
    const w = {id:uid(), naam, thema, omschrijving:oms, relevant: naam==='Compliance'?'Ja':'', bron:'Bijlage A'};
    if(naam==='Compliance') w.vast = true;
    list.push(w); n++;
  }
  const c = list.find(w=>(w.naam||'').toLowerCase()==='compliance'); if(c){ c.vast = true; c.relevant = 'Ja'; }
  save(); return n;
}
function waTabel(){
  const list = items('waardeaspecten');
  const B = state.data.best;
  const geenBeleid = B.beleid!=='Ja';
  const signaal = items('consequenties').some(c=>c.sig==='beleid');
  const thema = ['Functionaliteit','Leefomgeving en maatschappij','Organisatiespecifiek'];
  const groups = thema.map(t=>[t, list.filter(w=>(w.thema||'Organisatiespecifiek')===t)]).filter(g=>g[1].length);
  const open = list.filter(w=>!w.relevant).length;
  const view = ui.wview||'tabel';
  const tabel = `<div class="panel" style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:14px">
    <tr class="small muted" style="text-align:left"><th style="padding:6px;width:170px">Hoofdthema</th><th>Waardeaspect</th><th style="width:150px">Van toepassing?</th><th>Assetmanagementdoelstelling(en)</th></tr>
    ${groups.map(([t,ws])=>ws.map((w,i)=>{ const doelen = items('amdoelen').filter(d=>d.aspect===w.id);
      return `<tr style="border-top:1px solid var(--line);vertical-align:top;${w.relevant==='Nee'?'opacity:.5':''}">
        ${i===0?`<td rowspan="${ws.length}" style="padding:8px 6px;font-weight:600;background:#fafbfa">${esc(t)}</td>`:''}
        <td style="padding:8px 6px"><b>${esc(w.naam)}</b>${w.vast?' 🔒':''}<div class="small muted">${esc(w.omschrijving||'')}</div></td>
        <td><select data-rk="waardeaspecten" data-rid="${w.id}" data-rf="relevant" ${w.vast?'disabled':''} style="${!w.relevant?'border-color:#e0a95c':''}">
          <option value="">— kies —</option>${['Ja','Nee'].map(o=>`<option ${w.relevant===o?'selected':''}>${o}</option>`).join('')}</select></td>
        <td style="padding:6px">${doelen.map(d=>`<div class="small" style="cursor:pointer" data-gotodoel="${d.id}">• ${esc(d.titel)||'(naamloos)'}</div>`).join('')}
          ${w.relevant==='Ja'?`<button data-newdoel="${w.id}" style="font-size:12px;padding:3px 8px;margin-top:4px">+ AM-doelstelling</button>`:''}
          ${w.relevant==='Ja'&&!doelen.length?`<div class="small" style="color:#b5651d">nog geen doelstelling</div>`:''}</td></tr>`;}).join('')).join('')}
  </table></div>`;
  return `<div class="note small">${SINTRO.waardeaspecten}</div>
    ${geenBeleid?`<div class="warn small"><b>Geen (vastgesteld) assetmanagementbeleid?</b> Dan neemt de assetmanager het initiatief — niet door zelf beleid te maken, maar door de asset owner duidelijk te maken dat sturing nodig is (Bijlage A, opm. 2).
      <div style="margin-top:6px">${signaal?'✓ Vastgelegd als consequentie op strategisch niveau.':`<button data-signal="beleid">Leg vast als signaal aan de asset owner</button>`}</div></div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <button class="primary" data-loada="1">${list.length?'Ontbrekende aspecten uit Bijlage A aanvullen':'Startlijst uit Bijlage A laden'}</button>
      <button data-wview="${view==='tabel'?'lijst':'tabel'}">${view==='tabel'?'Bewerken / eigen aspect toevoegen':'Terug naar tabel'}</button>
      ${list.length?`<span class="small muted">${list.filter(w=>w.relevant==='Ja').length} van toepassing · ${list.filter(w=>w.relevant==='Nee').length} niet · ${open?`<b style="color:#b5651d">${open} nog te beoordelen</b>`:'alles beoordeeld'}</span>`:''}
    </div>
    ${view==='lijst' || !list.length ? renderRegister('waardeaspecten') : tabel}`;
}
function renderWaardeaspecten(){
  return `<h2>Waardeaspectentabel</h2><div class="ref">NEN 8026 §6.3.1 en Bijlage A (tabel A.1) · ook bereikbaar via Strategisch niveau</div>${waTabel()}`;
}
function renderRollen(){
  const comb = items('personen').filter(p=>gecombineerd(p.id));
  const rol = r => items('personen').filter(p=>(p.rollen||[]).includes(r)).map(p=>esc(p.naam)).join(', ') || '<span style="color:#b5651d">nog niet belegd</span>';
  return `<h2>Rolverdeling</h2><div class="ref">NEN 8026 §4.7 · rollen zijn geen functies</div>
    <div class="cards" style="margin-bottom:14px">${['Asset owner','Gemandateerd asset owner','Assetmanager','Serviceprovider'].map(r=>`<div class="card"><h3>${r}</h3><p>${rol(r)}</p></div>`).join('')}</div>
    ${comb.length?`<div class="warn small">Gecombineerde rollen bij: <b>${comb.map(p=>esc(p.naam)).join(', ')}</b>. Dat mag, maar leg bij portfoliobesluiten vast in welke rol het besluit genomen is: de assetmanager neemt geen besluiten die op bestuurlijk niveau horen (§6.3.3).</div>`:''}
    ${renderRegister('personen')}`;
}

/* ---------------- Overige modules (nog te bouwen) ---------------- */
function renderModule(m){
  return `<h2>${m.title}</h2><div class="ref">NEN 8026 ${m.ref}${m.product?' · product: <b>'+m.product+'</b>':''}</div>
    <div class="cards">${(m.parts||[]).map(([t,ref])=>`
      <div class="card" style="border-left:4px solid ${m.color}"><h3>${t}</h3><p>${ref}</p>
      <div style="margin-top:8px"><span class="badge todo">Nog te bouwen</span></div></div>`).join('')}</div>`;
}

/* ---------------- Router ---------------- */
function route(){
  const id = location.hash.slice(1) || 'start';
  const m = MODULES.find(x=>x.id===id) || MODULES[0];
  renderNav(m.id);
  main.innerHTML = ({start:renderStart, basis:renderBasis, assets:renderAssets, bestuurlijk:renderBestuurlijk, strategisch:renderStrategisch, waardeaspecten:renderWaardeaspecten, rollen:renderRollen})[m.id]?.() ?? renderModule(m);
  main.innerHTML += `<footer>Deze tool bevat geen normtekst of figuren uit NEN 8026; omschrijvingen en figuren zijn eigen samenvattingen. Raadpleeg de norm voor de officiële inhoud.</footer>`;
}
function rerender(){ const y = window.scrollY; route(); window.scrollTo(0,y); }

/* ---------------- Interactie (event delegation) ---------------- */
main.addEventListener('click', e=>{
  const r = e.target.closest('[data-btab],[data-stab],[data-rsel],[data-radd],[data-rdel],[data-apply],[data-print]');
  if(r){
    const d = r.dataset;
    if(d.btab){ ui.btab = d.btab; window.scrollTo(0,0); route(); return; }
    if(d.stab){ ui.stab = d.stab; window.scrollTo(0,0); route(); return; }
    if(d.print){ window.print(); return; }
    if(d.rsel){ const [k,id] = d.rsel.split(':'); ui.sel[k]=id; ui.rarmed=null; }
    else if(d.radd){ const it = {id:uid()}; items(d.radd).push(it); ui.sel[d.radd]=it.id; ui.rarmed=null; save(); rerender();
      main.querySelector('.form input, .form select')?.focus(); return; }
    else if(d.rdel){ const [k,id] = d.rdel.split(':');
      if(ui.rarmed!==id){ ui.rarmed=id; } else { state.data.reg[k] = items(k).filter(x=>x.id!==id); ui.sel[k]=null; ui.rarmed=null; save(); } }
    else if(d.apply){ const b = items('besluiten').find(x=>x.id===d.apply); const f = b.richting==='Opwaarderen'?'op':'af';
      for(const a of state.data.assets) if(b.assets.includes(a.id)){ a.fase=f; a.toelichting = (b.titel||'Besluit')+(b.datum?' ('+b.datum+')':''); }
      save(); }
    rerender(); return;
  }
  const t = e.target.closest('[data-step],[data-tab],[data-phase],[data-schil],[data-tier],[data-glb],[data-node],[data-add],[data-del],[data-krit]');
  if(!t) return;
  const d = t.dataset;
  if(d.step){ ui.step = d.step; }
  else if(d.tab){ ui.tab = d.tab; }
  else if(d.phase){ ui.phase = d.phase; }
  else if(d.schil){ ui.schil = d.schil; }
  else if(d.tier){ ui.tier = d.tier; }
  else if(d.glb!==undefined){ ui.glb = d.glb; }
  else if(d.node){ ui.node = d.node; ui.armed=false; }
  else if(d.add!==undefined){
    const parent = d.add || null;
    const p = state.data.assets.find(x=>x.id===parent);
    const a = {id:uid(), parent, niveau:p?p.niveau+1:0, naam:'', assettype:'', fase:p?p.fase:'gebruik', krit:null};
    state.data.assets.push(a); ui.node = a.id; ui.armed=false; save();
    rerender(); main.querySelector('[data-f="naam"]')?.focus(); return;
  }
  else if(d.del){
    if(!ui.armed){ ui.armed = true; }
    else{
      const kill = new Set([d.del]); let grew = true;
      while(grew){ grew=false; for(const a of state.data.assets) if(!kill.has(a.id)&&kill.has(a.parent)){kill.add(a.id);grew=true;} }
      state.data.assets = state.data.assets.filter(a=>!kill.has(a.id)); ui.node=null; ui.armed=false; save();
    }
  }
  else if(d.krit){ const a = state.data.assets.find(x=>x.id===ui.node); a.krit = a.krit===+d.krit?null:+d.krit; save(); }
  rerender();
});
main.addEventListener('input', e=>{
  const el = e.target, d = el.dataset;
  if(d.rf){
    const it = items(d.rk).find(x=>x.id===d.rid); if(!it) return;
    if(el.type==='checkbox'){ const arr = new Set(it[d.rf]||[]); el.checked?arr.add(d.rv):arr.delete(d.rv); it[d.rf]=[...arr]; }
    else it[d.rf] = el.value;
    save();
    if(el.tagName==='SELECT' || el.type==='checkbox' || el.type==='date') rerender();
    else { const l = main.querySelector(`[data-rsel="${d.rk}:${d.rid}"] .rl`); if(l) l.innerHTML = esc(REG[d.rk].label(it))||'<i class="muted">(naamloos)</i>'; }
    return;
  }
  if(d.af){
    const a = state.data.assets.find(x=>x.id===d.af); if(!a) return;
    if(el.type==='checkbox'){ const s = new Set(a[d.ak]||[]); el.checked?s.add(d.rv):s.delete(d.rv); a[d.ak]=[...s]; }
    else a[d.ak] = el.value;
    save(); if(d.ak==='fase'||d.ak==='transEind') rerender(); return;
  }
  if(d.best){ state.data.best[d.best] = el.value; save(); if(el.tagName==='SELECT') rerender(); return; }
  if(d.info){ (state.data.info[d.info] ||= {})[d.ik] = el.value; save(); return; }
  if(e.target.id==='glq'){
    ui.glq = e.target.value; const pos = e.target.selectionStart; rerender();
    const i = document.getElementById('glq'); i.focus(); i.setSelectionRange(pos,pos); return;
  }
  const f = e.target.dataset.f; if(!f) return;
  const a = state.data.assets.find(x=>x.id===ui.node); if(!a) return;
  a[f] = e.target.value; save();
  if(f==='fase') rerender();
  else { const n = main.querySelector(`[data-node="${a.id}"] span:nth-child(2)`); if(n && f==='naam') n.innerHTML = esc(a.naam)||'<i class="muted">(naamloos)</i>'; }
});

/* ---------------- Header: rol, sector, export/import ---------------- */
const rolSel = document.getElementById('rol');
rolSel.innerHTML = Object.entries(ROLLEN).map(([k,r])=>`<option value="${k}">${r.naam}</option>`).join('');
rolSel.value = state.rol;
rolSel.onchange = ()=>{ state.rol = rolSel.value; save(); rerender(); };
const sel = document.getElementById('sector');
sel.innerHTML = SECTOREN.map(s=>`<option value="${s.id}">${s.naam}</option>`).join('');
sel.value = state.sector;
sel.onchange = ()=>{ state.sector = sel.value; save(); rerender(); };

document.getElementById('btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `nen8026-gegevens-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
};
const fileInput = document.getElementById('fileImport');
document.getElementById('btnImport').onclick = ()=>fileInput.click();
fileInput.onchange = async ()=>{
  const f = fileInput.files[0]; if(!f) return;
  try{ const s = JSON.parse(await f.text()); state = {...DEFAULT, ...s, data:{...DEFAULT.data, ...(s.data||{})}}; save();
       sel.value = state.sector; rolSel.value = state.rol; route(); }
  catch(e){ console.log('Ongeldig bestand'); }
  fileInput.value='';
};

window.addEventListener('hashchange', ()=>{ window.scrollTo(0,0); route(); });
route();
</script>
</body>
</html>
